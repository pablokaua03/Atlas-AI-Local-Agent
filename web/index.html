<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/ui.css">
<title>Agente Local</title>
<style>
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);transition:background .2s,color .2s}
  button{font-family:inherit}
  #wrap{display:flex;height:100%}

  /* ── SIDEBAR ── */
  #side{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:margin-left .2s}
  #side.hide{margin-left:-260px}
  .sbtop{display:flex;align-items:center;gap:8px;padding:14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex:1}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff}
  .novo{margin:0 12px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;
    padding:11px;cursor:pointer;font-size:14px;font-weight:600}
  .novo:hover{border-color:var(--accent)}
  .lista{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
  .item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--dim)}
  .item:hover{background:var(--panel);color:var(--txt)}
  .item.sel{background:var(--panel);color:var(--txt)}
  .item .tit{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .acts{display:none;gap:2px}
  .item:hover .acts{display:flex}
  .ic{background:none;border:none;color:var(--dim);cursor:pointer;padding:3px;border-radius:6px;display:flex}
  .ic:hover{color:var(--txt);background:var(--panel2)}
  .ic.del:hover{color:var(--danger)}
  .item input{flex:1;background:var(--bg);border:1px solid var(--accent);color:var(--txt);
    border-radius:6px;padding:4px 6px;font-size:13px;font-family:inherit;outline:none}
  .sbfoot{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

  /* ── MAIN ── */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .hbtn{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--txt);
    border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;padding:0}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  #powerBtn.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
  #powerBtn.off{color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
  header .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin-left:auto}
  header .pill.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  header .pill.off{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}

  #banner{margin:12px 16px 0;padding:11px 14px;border-radius:12px;
    background:color-mix(in srgb,var(--warn) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    color:var(--txt);font-size:13.5px;display:none;align-items:center;gap:10px}
  #banner .bbtn{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

  #chat{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:11px;max-width:780px;width:100%;margin:0 auto}
  .msg.user{flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .av.a{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .av.u{background:var(--panel2);color:var(--dim)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 15px;
    font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;max-width:calc(100% - 42px)}
  .msg.user .bubble{background:var(--userbg)}
  .empty{margin:auto;text-align:center;color:var(--dim);font-size:14.5px;line-height:1.7}
  .empty .big{font-size:42px;margin-bottom:6px}

  #bar{padding:12px 16px 16px;border-top:1px solid var(--line)}
  .barin{max-width:780px;margin:0 auto;display:flex;gap:9px;align-items:flex-end;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
  .barin:focus-within{border-color:var(--accent)}
  #input{flex:1;background:transparent;border:none;color:var(--txt);font-size:14.5px;font-family:inherit;
    outline:none;resize:none;max-height:180px;padding:6px 0;line-height:1.5}
  #send{background:var(--accent);color:#fff;border:none;border-radius:11px;width:38px;height:38px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #send:disabled{opacity:.4;cursor:default}
  #send.stop{background:var(--danger)}
  #attachBtn{background:transparent;border:none;color:var(--dim);font-size:18px;width:34px;height:38px;
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #attachBtn:hover{color:var(--txt)}
  #anexosBar{max-width:780px;margin:0 auto 7px;display:none;gap:7px;flex-wrap:wrap}
  .anexo{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:4px 8px;font-size:12px;color:var(--txt);max-width:200px}
  .anexo img{width:30px;height:30px;object-fit:cover;border-radius:5px}
  .anexo .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anexo .x{cursor:pointer;color:var(--dim);font-weight:700}.anexo .x:hover{color:var(--danger)}
  .bubble .imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .bubble .imgs img{max-width:200px;max-height:200px;border-radius:9px;border:1px solid var(--line)}
  #chat.drag{outline:2px dashed var(--accent);outline-offset:-8px}
  #chatActions{max-width:780px;margin:0 auto;text-align:center;padding:2px 16px 10px}
  #regenBtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;
    padding:7px 16px;cursor:pointer;font-size:12.5px;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s,border-color .15s,background .15s}
  #regenBtn:hover{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  #regenBtn span{line-height:1}
  /* markdown das respostas (md.js) */
  .bubble.md{white-space:normal}
  .bubble .body>:first-child{margin-top:0} .bubble .body>:last-child{margin-bottom:0}
  .bubble p{margin:0 0 9px}
  .bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:14px 0 6px;line-height:1.3}
  .bubble h3{font-size:16.5px} .bubble h4{font-size:15.5px} .bubble h5,.bubble h6{font-size:14.5px;color:var(--dim)}
  .bubble ul,.bubble ol{margin:6px 0 10px;padding-left:22px} .bubble li{margin:3px 0} .bubble li>ul,.bubble li>ol{margin:3px 0}
  .bubble li input[type=checkbox]{margin:0 5px 0 -2px;vertical-align:-1px}
  .bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-word}
  .bubble blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--dim);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:0 8px 8px 0}
  .bubble hr{border:none;border-top:1px solid var(--line);margin:12px 0}
  .bubble del{opacity:.7}
  .bubble code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em}
  .md-code{margin:9px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
  .md-codebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 4px 12px;
    background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
  .md-copy{background:transparent;border:1px solid transparent;color:var(--dim);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer;min-height:26px}
  .md-copy:hover{color:var(--txt);border-color:var(--line)} .md-copy.ok{color:var(--good)}
  .md-code pre{margin:0;padding:11px 13px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.8px;line-height:1.5;white-space:pre}
  .md-code pre code{background:none;border:none;padding:0;font-size:inherit}
  .md-table{overflow-x:auto;margin:9px 0;border:1px solid var(--line);border-radius:10px}
  .md-table table{border-collapse:collapse;width:100%;font-size:13.5px}
  .md-table th,.md-table td{padding:7px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .md-table th{background:var(--panel2);font-weight:600} .md-table tr:last-child td{border-bottom:none}
  .md-table tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  /* coluna da mensagem: balão + ações */
  .mcol{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:calc(100% - 42px)}
  .msg.user .mcol{align-items:flex-end}
  .mcol .bubble{max-width:100%}
  .mact{display:flex;gap:2px;opacity:0;transition:opacity .15s;min-height:26px;align-items:center}
  .msg:hover .mact,.msg:focus-within .mact{opacity:1}
  .mact button{background:none;border:none;color:var(--dim);cursor:pointer;border-radius:7px;padding:3px 8px;font-size:12px;min-height:26px}
  .mact button:hover{color:var(--txt);background:var(--panel2)}
  .mact .tag{margin-left:4px}
  .tag.parcial{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
  .bubble.streaming{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .dots{display:inline-flex;gap:4px;padding:4px 0} .dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1.2s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  #chatWrap{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
  #descer{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 14px;font-size:12.5px;
    cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
  #descer:hover{border-color:var(--accent)} #descer.on{display:inline-flex}
  /* estado vazio com sugestões */
  .empty .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:22px auto 0;max-width:560px;text-align:left}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 13px;cursor:pointer;
    font-size:13.5px;line-height:1.4;display:flex;gap:9px;align-items:flex-start;transition:border-color .15s,background .15s}
  .chip:hover,.chip:focus-visible{border-color:var(--accent);background:var(--panel2);outline:none}
  .chip .ce{font-size:16px;line-height:1.2}
  .chip small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  /* barra lateral: busca e grupos por data */
  .busca{margin:0 12px 6px;position:relative}
  .busca input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:8px 30px 8px 32px;font-size:13px;outline:none}
  .busca input:focus{border-color:var(--accent)}
  .busca .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
  .busca .lim{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:none}
  .busca.tem .lim{display:flex}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:12px 10px 4px;font-weight:700}
  .grp:first-child{padding-top:4px}
  .item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .item .tr{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .item .tr mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--txt);border-radius:3px;padding:0 1px}
  .item .mdl{font-size:10px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:5px;padding:0 4px;flex-shrink:0}
  .lista .ui-empty{padding:14px 10px;font-size:12.5px}
  /* banner do Ollama */
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--txt) 25%,transparent);border-top-color:var(--accent);
    animation:gira .8s linear infinite;flex-shrink:0}
  @keyframes gira{to{transform:rotate(360deg)}}
  #banner.ok{background:color-mix(in srgb,var(--good) 14%,var(--bg));border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  #banner.err{background:color-mix(in srgb,var(--danger) 12%,var(--bg));border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
  #banner .bbtn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);margin-left:0}
  #banner .bbtn:disabled{opacity:.7;cursor:default}
  #bannerSpin{display:none} #banner.busy #bannerSpin{display:block}
  #ctxBar #modelSel{max-width:200px}

  /* ── DRAWER CONFIG ── */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
  #cfg{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--bg);
    border-left:1px solid var(--line);z-index:10;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:18px}
  #cfg.open{transform:none}
  #cfg h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:22px 0 10px}
  #cfg h2:first-of-type{margin-top:4px}
  .close{float:right;cursor:pointer;color:var(--dim);background:none;border:none;font-size:20px}
  .field input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--accent)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:8px;font-size:13px;cursor:pointer}
  .seg button.on{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border-color:var(--accent);color:var(--txt);font-weight:600}
  .modelo{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;background:var(--panel)}
  .modelo.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
  .modelo .top{display:flex;align-items:center;gap:8px}
  .modelo .rot{font-weight:600;font-size:14.5px}
  .modelo .nm{font-size:12px;color:var(--dim);margin-left:auto;font-family:ui-monospace,monospace}
  .modelo .desc{font-size:12.5px;color:var(--dim);margin-top:3px}
  .modelo .st{font-size:12px;margin-top:7px} .modelo .st.ok{color:var(--good)} .modelo .st.no{color:var(--warn)}
  .baixar{margin-top:7px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:9px;
    padding:6px 11px;font-size:12.5px;cursor:pointer}
  .baixar:hover{background:var(--accent);color:#fff}
  .prog{height:6px;background:var(--panel2);border-radius:4px;margin-top:7px;overflow:hidden;display:none}
  .prog>div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .skill{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .skill .info{flex:1} .skill .nm{font-size:14px} .skill .d{font-size:12px;color:var(--dim)}
  .sw{width:42px;height:24px;border-radius:14px;background:var(--panel2);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
  .sw.on{background:var(--good)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on::after{left:21px}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px}
  .foot{font-size:11px;color:var(--dim);margin-top:18px;line-height:1.5}

  /* ── AJUSTES EM SEÇÕES ── */
  details.sec{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--panel)}
  details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-radius:12px}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary .stt{font-size:14px;font-weight:700;color:var(--txt)}
  details.sec>summary .stt::before{content:"▸";display:inline-block;width:16px;color:var(--dim);transition:transform .15s}
  details.sec[open]>summary .stt::before{transform:rotate(90deg)}
  details.sec>summary .std{font-size:12px;color:var(--dim);padding-left:16px}
  details.sec .sbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
  details.sec .sfoot{margin-top:14px;display:flex;justify-content:flex-end}
  .sub{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:16px 0 8px;font-weight:700}
  .rest{background:transparent;border:1px dashed var(--line);color:var(--dim);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .rest:hover{color:var(--txt);border-color:var(--accent)}
  .skill.col{flex-direction:column;align-items:stretch;gap:8px}
  .numbox{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .num{width:84px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px;font-family:inherit;text-align:center}
  .num:focus,.ta:focus,.sel:focus{border-color:var(--accent)}
  .rg{font-size:10.5px;color:var(--dim)}
  .ta,.sel{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;margin:6px 0;resize:vertical}
  .d.warn,.warn{color:var(--warn)} .d.note{margin-top:10px;line-height:1.5}
  .budget{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:9px}
  .nm.sp{margin-top:16px}
  #mFilter2{flex-wrap:wrap;margin-bottom:10px} #mFilter2 button{flex:0 0 auto;padding:6px 10px;font-size:12.5px}
  .hw{font-size:12.5px;color:var(--dim);margin:10px 0 4px;line-height:1.5} .hw strong{color:var(--txt);font-weight:600}
  .mwarn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:9px 11px;border-radius:10px;font-size:12.5px;
    background:color-mix(in srgb,var(--warn) 12%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
  .mwarn .baixar{margin-top:0}
  .fit{display:inline-block;margin-top:7px;font-size:11.5px;border-radius:7px;padding:2px 8px;border:1px solid}
  .fit.vram{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
  .fit.parcial{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
  .fit.grande{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
  .modelo.inst .top .tag{margin-left:0}
  .pullrow{display:flex;gap:7px;align-items:center} .pullrow .sel{margin:0;flex:1;min-width:0} .pullrow .baixar{margin-top:0}
  #modelos>.d{font-size:12px;color:var(--dim);margin-top:5px}
  #modelos>h3.sub:first-child{margin-top:8px}
  details.usadas .uhint{font-size:11.5px;margin-top:5px}
  details.usadas .mt{display:flex;flex-direction:column;gap:4px}
  details.usadas .mm{display:flex;gap:4px;flex-wrap:wrap}

<body>
<div id="wrap">
  <aside id="side">
    <div class="sbtop">
      <div class="brand"><span class="logo">◆</span><span id="brandTxt">Agente Local</span></div>
    </div>
    <button class="novo" id="novoChat">＋ <span id="novoTxt">Novo chat</span></button>
    <div class="busca" id="buscaBox"><span class="lupa" aria-hidden="true">⌕</span><input type="search" id="buscaChat" autocomplete="off"><button type="button" class="ic lim" id="buscaLimpar">✕</button></div>
    <div class="lista" id="lista" aria-label="Conversas"><span class="ui-skel pill"></span><span class="ui-skel pill"></span><span class="ui-skel pill"></span></div>
    <div class="sbfoot" id="sbfoot"></div>
  </aside>

  <main id="main">
    <header>
      <button class="hbtn" id="toggleSide" title="menu">☰</button>
      <button class="hbtn" id="powerBtn" title="ligar/desligar">⏻</button>
      <button class="hbtn" id="lockBtn" title="cofre" style="display:none">🔒</button>
      <span class="pill" id="sysPill" style="font-family:ui-monospace,monospace;font-size:11.5px"></span>
      <span class="pill" id="pill">…</span>
      <button class="hbtn" id="themeBtn" title="tema">🌙</button>
      <a class="hbtn" id="memBtn" href="/memorias" title="Memórias">🗂️</a>
      <a class="hbtn" id="grafoBtn" href="/grafo" title="Grafo">🕸️</a>
      <button class="hbtn" id="gear" title="config">⚙</button>
    </header>
    <div id="banner" role="status"><span class="spin" id="bannerSpin"></span><span id="bannerTxt"></span><button class="bbtn" id="bannerBtn" style="display:none"></button><button class="bbtn sec" id="bannerBtn2" style="display:none"></button></div>
    <div id="chatWrap">
      <div id="chat" aria-live="polite"><div class="ld"><span class="ui-skel"></span><span class="ui-skel"></span><span class="ui-skel"></span></div></div>
      <button type="button" id="descer">↓ <span id="descerTxt"></span></button>
    </div>
    <div id="chatActions" style="display:none"><button id="regenBtn"><span>↻</span><span id="regenTxt"></span></button></div>
    <div id="fatoBar" hidden role="status"></div>
    <div id="bar">
      <div id="ctxBar"><label for="projSel" id="projLabel">Projeto</label><select id="projSel"></select><select id="modelSel"></select><button type="button" id="ctxBtn">🧠</button></div>

        <button id="attachBtn" title="anexar">📎</button>
        <textarea id="input" rows="1"></textarea>
        <button id="send" title="enviar">➤</button>
      </div>
    </div>
    <input type="file" id="anexoFile" accept="image/*,.txt,.md,.pdf,.json,.js,.py,.csv,.log,.html,.css,.ts" multiple style="display:none">
  </main>
</div>

      <div class="sfoot"><button type="button" class="rest" data-rest="privacidade"></button></div>

  <div class="foot" id="foot"></div>
</div>

const t=(k,v)=>{let s=(I18N[LANG]&&I18N[LANG][k])||I18N.pt[k]||k; if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]); return s;};

function aplicarTema(){ document.documentElement.setAttribute('data-tema',TEMA);
  $('#themeBtn').textContent = TEMA==='escuro'?'☀️':'🌙'; }

// confirmação padrão (modal do Atlas) no lugar do confirm() do navegador
const conf=(msg,o)=>AtlasUI.confirm({title:(o&&o.title)||t('confirmT'),message:msg,okText:(o&&o.ok)||t('confirmT'),cancelText:t('cancel'),danger:!!(o&&o.danger)});
function semConexao(){bannerUI(t('connErr'),{kind:'err'});}
async function carregarEstado(){
  try{
    const r=await fetch('/api/estado');if(!r.ok)throw new Error('HTTP '+r.status);
    estado=await r.json();
  }catch(e){semConexao();return false;}
  LANG=estado.config.idioma||'pt'; TEMA=estado.config.tema||'escuro';
  aplicarTema(); render();
  return true;
}

function render(){
  const cfg=estado.config; fixos();
  const pill=$('#pill');
  if(!estado.ollama_online){pill.className='pill off';pill.textContent=t('pillOff');}
  else{pill.className='pill on';pill.textContent=modeloEfetivo();}
  // interruptor mestre
  const ativo=cfg.ativo!==false;
  $('#powerBtn').className='hbtn '+(ativo?'on':'off');
  $('#powerBtn').title=ativo?t('pause'):t('activate');
  if(!ativo){pill.className='pill off';pill.textContent='⏸ '+t('paused');}
  // cofre (cadeado no header + modal de desbloqueio)
  const co=estado.cofre||{ligada:false,desbloqueado:true};
  const lb=$('#lockBtn');
  lb.style.display=co.ligada?'inline-flex':'none';
  lb.textContent=co.desbloqueado?'🔓':'🔒';
  lb.title=co.desbloqueado?t('lockNow'):t('unlock');
  if(co.ligada&&!co.desbloqueado){if($('#cofreModal').style.display!=='flex')abrirCofreModal();}else{$('#cofreModal').style.display='none';}
  renderBanner();
  renderModelSel();
  // seg idioma/tema
  seg('#langSeg',['pt','en','es'],LANG,l=>l.toUpperCase(),l=>salvarConfig({idioma:l}));
  seg('#themeSeg',['escuro','claro'],TEMA,l=>t(l==='escuro'?'dark':'light'),l=>{TEMA=l;aplicarTema();salvarConfig({tema:l});});
  $('#nome').value=['você','you','tú'].includes(cfg.nome)?'':cfg.nome;
  // skills
  $('#skills').innerHTML='';
  for(const k of Object.keys(SKILLS)){const on=!!cfg.habilidades[k];
    const r=document.createElement('div');r.className='skill';
    r.innerHTML=`<div class="info"><div class="nm">${t('sk_'+k)}</div><div class="d">${t('sk_'+k+'_d')}</div></div><div class="sw ${on?'on':''}"></div>`;
    r.querySelector('.sw').onclick=()=>salvarConfig({habilidades:{[k]:!on}});$('#skills').appendChild(r);
    if(k==='wikipedia'){
      const wb=document.createElement('div');wb.style.cssText='padding:2px 0 10px;border-bottom:1px solid var(--line)';
      if(estado.wiki_pronto){wb.innerHTML=`<div class="d" style="color:var(--good)">${t('wikiReady')}</div>`;}
      else{const b=document.createElement('button');b.className='baixar';b.textContent=t('wikiDl');
        const pr=document.createElement('div');pr.className='prog';pr.innerHTML='<div></div>';
        b.onclick=()=>baixarWiki(b,pr);wb.appendChild(b);wb.appendChild(pr);}
      $('#skills').appendChild(wb);}
    if(k==='documentos'&&on){
      const db=document.createElement('div');db.style.cssText='padding:2px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px';
      db.innerHTML=`<div class="d" id="docsStat">${t('docsEmpty')}</div>`;
      const row=document.createElement('div');row.style.cssText='display:flex;gap:7px';
      const ob=document.createElement('button');ob.className='baixar';ob.style.flex='1';ob.textContent=t('docsOpen');ob.onclick=abrirDocs;
      const rb=document.createElement('button');rb.className='baixar';rb.style.flex='1';rb.textContent=t('docsReindex');rb.onclick=()=>reindexDocs(rb);
      row.appendChild(ob);row.appendChild(rb);db.appendChild(row);$('#skills').appendChild(db);
      atualizarDocsStatus();}
    if(k==='tela'){
      const tb=document.createElement('div');tb.style.cssText='padding:2px 0 10px;border-bottom:1px solid var(--line)';
      if(estado.tesseract_instalado){
        tb.innerHTML=`<div class="d" style="color:var(--good)">${t('ocrReady')}</div>`;
        const ub=document.createElement('button');ub.className='baixar';ub.style.borderColor='var(--danger)';ub.style.color='var(--danger)';ub.textContent=t('ocrUninstall');
        ub.onclick=()=>desinstalarOCR(ub);tb.appendChild(ub);
      }else{
        const b=document.createElement('button');b.className='baixar';b.textContent=t('ocrInstall');b.onclick=()=>instalarOCR(b);
        const nt=document.createElement('div');nt.className='d';nt.style.marginTop='5px';nt.textContent=t('ocrNeed');
        tb.appendChild(b);tb.appendChild(nt);}
      $('#skills').appendChild(tb);}
  }
  // frequência das prints (intervalo de observação da tela)
  const iv=cfg.obs_intervalo||60;
  const ivr=document.createElement('div');ivr.className='skill';
  ivr.innerHTML=`<div class="info"><div class="nm">${t('obsFreq')}</div><div class="d">${t('obsFreq_d')}</div></div>`;
  const ii=document.createElement('input');ii.type='number';ii.min=15;ii.max=900;ii.value=iv;
  ii.style.cssText='width:64px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px;font-family:inherit;text-align:center';
  ii.onchange=()=>salvarConfig({obs_intervalo:parseInt(ii.value)||60});
  ivr.appendChild(ii);$('#skills').appendChild(ivr);
  // modo da iniciativa (dinâmico ou a cada X min)
  const imodo=cfg.iniciativa_modo||'dinamico';
  const ib=document.createElement('div');ib.style.cssText='padding:10px 0;border-bottom:1px solid var(--line)';
  ib.innerHTML=`<div class="nm" style="margin-bottom:7px">${t('iniMode')}</div><div class="seg" id="iniSeg"></div>
    <div id="iniIv" style="margin-top:9px;align-items:center;gap:8px;display:${imodo==='intervalo'?'flex':'none'}"><span class="d">${t('iniMin')}</span></div>`;
  $('#skills').appendChild(ib);
  seg('#iniSeg',['dinamico','intervalo'],imodo,v=>t(v==='dinamico'?'iniDinamico':'iniIntervalo'),v=>salvarConfig({iniciativa_modo:v}));
  const im=document.createElement('input');im.type='number';im.min=1;im.max=180;im.value=cfg.iniciativa_intervalo||10;
  im.style.cssText='width:64px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px;font-family:inherit;text-align:center';
  im.onchange=()=>salvarConfig({iniciativa_intervalo:parseInt(im.value)||10});
  ib.querySelector('#iniIv').appendChild(im);
  // autostart
  const aon=!!cfg.iniciar_com_windows;$('#initBox').innerHTML='';
  const ir=document.createElement('div');ir.className='skill';ir.style.borderBottom='none';
  ir.innerHTML=`<div class="info"><div class="nm">${t('autostart')}</div><div class="d">${t('autostart_d')}</div></div><div class="sw ${aon?'on':''}"></div>`;
  ir.querySelector('.sw').onclick=()=>salvarConfig({iniciar_com_windows:!aon});$('#initBox').appendChild(ir);
  renderSeguranca(); renderApi(); renderLembretes(); AjustesUI.render(); acessivel();
}

// teclado/leitor de tela: interruptores viram role=switch e botões de ícone ganham nome
function acessivel(){
  document.querySelectorAll('.sw').forEach(sw=>{
    if(sw.dataset.a11y)return;sw.dataset.a11y='1';sw.tabIndex=0;sw.setAttribute('role','switch');
    sw.setAttribute('aria-checked',String(sw.classList.contains('on')));
    const nm=sw.parentElement&&sw.parentElement.querySelector('.nm');if(nm)sw.setAttribute('aria-label',nm.textContent);
    sw.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sw.click();}};});
  document.querySelectorAll('.hbtn').forEach(b=>b.setAttribute('aria-label',b.title||b.textContent.trim()));
}

  const co=estado.cofre||{ligada:false};const box=$('#secBox');box.innerHTML='';

    const inp=document.createElement('input');inp.type='password';inp.placeholder=t('secPwPh');
    inp.style.cssText='width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-family:inherit;margin-bottom:8px';
    const b=document.createElement('button');b.className='baixar';b.style.width='100%';b.textContent=t('secEnable');
    b.onclick=()=>ativarCripto(inp.value,b);box.appendChild(inp);box.appendChild(b);
  }else{
    const lk=document.createElement('button');lk.className='baixar';lk.style.width='100%';lk.style.marginBottom='8px';lk.textContent=t('secLock');
    lk.onclick=bloquearCofre;box.appendChild(lk);
    const inp=document.createElement('input');inp.type='password';inp.placeholder=t('secDisPh');
    inp.style.cssText='width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-family:inherit;margin-bottom:8px';
    const b=document.createElement('button');b.className='baixar';b.style.width='100%';b.style.borderColor='var(--danger)';b.style.color='var(--danger)';b.textContent=t('secDisable');
    b.onclick=()=>desativarCripto(inp.value,b);box.appendChild(inp);box.appendChild(b);
  }
}
async function ativarCripto(senha,btn){
  if(!senha||senha.length<4){btn.textContent=t('secMin');return;}
  btn.disabled=true;const r=await(await fetch('/api/cofre/ativar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha})})).json();
  if(r.ok){await carregarEstado();}else{btn.disabled=false;btn.textContent=t('secEnable');}
}
async function desativarCripto(senha,btn){
  btn.disabled=true;const r=await(await fetch('/api/cofre/desativar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha})})).json();
  if(r.ok){await carregarEstado();}else{btn.disabled=false;btn.textContent=t('secBad');}
}
async function bloquearCofre(){await fetch('/api/cofre/bloquear',{method:'POST'});await carregarEstado();}
function abrirCofreModal(){
  const m=$('#cofreModal');m.style.display='flex';$('#cofreTitle').textContent=t('unlockTitle');
  $('#cofreOk').textContent=t('unlock');$('#cofreErr').textContent='';$('#cofreSenha').value='';
  setTimeout(()=>$('#cofreSenha').focus(),50);
}
async function desbloquearCofre(){
  const s=$('#cofreSenha').value;if(!s)return;
  const r=await(await fetch('/api/cofre/desbloquear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:s})})).json();
  if(r.ok){$('#cofreModal').style.display='none';await carregarEstado();await carregarChats();}
  else{$('#cofreErr').textContent=t('secBad');$('#cofreSenha').value='';$('#cofreSenha').focus();}
}

async function renderApi(){
  let info=null;try{info=await(await fetch('/api/memapi')).json();}catch(e){}
  const box=$('#apiBox');box.innerHTML='';           // limpa só depois do fetch (evita duplicar)

function bannerUI(txt,o){
  o=o||{};const b=$('#banner');b.hidden=false;b.style.display='flex';
  b.className=(o.busy?'busy ':'')+(o.kind||'');$('#bannerTxt').textContent=txt;

function bannerFechar(){const b=$('#banner');b.style.display='none';b.className='';}
function renderBanner(){
  if(ollamaIniciando)return;
  if(!estado.ollama_online){
    if(estado.ollama_instalado)bannerUI(t('ollamaOff'),{btn:{txt:t('startOllama'),fn:iniciarOllama}});
    else bannerUI(t('ollamaNotInst'),{btn:{txt:t('installOllama'),fn:()=>instalarOllama($('#bannerBtn'))}});
    return;
  }
  if(!modelosChatInstalados().length){bannerUI(t('noModel'),{btn:{txt:'⚙ '+t('model'),fn:abrirCfgModelo}});return;}
  if(!instaladoNome(modeloEfetivo())){bannerUI(t('bannerModel',{m:modeloEfetivo()}),{btn:{txt:'⚙ '+t('model'),fn:abrirCfgModelo}});return;}
  bannerFechar();

async function iniciarOllama(){
  if(ollamaIniciando)return;ollamaIniciando=true;
  const t0=Date.now(),seg=()=>Math.round((Date.now()-t0)/1000);
  bannerUI(t('startingN',{s:0}),{busy:true,btn:{txt:t('starting'),disabled:true}});
  const tick=setInterval(()=>{$('#bannerTxt').textContent=t('startingN',{s:seg()});},1000);
  let r=null;
  try{r=await(await fetch('/api/ollama/start',{method:'POST'})).json();}catch(e){r=null;}
  let online=!!(r&&r.online);
  if(r&&r.erro==='nao_instalado'){clearInterval(tick);ollamaIniciando=false;
    bannerUI(t('startNotInst'),{kind:'err',btn:{txt:t('installOllama'),fn:()=>instalarOllama($('#bannerBtn'))}});return;}
  // o servidor espera ~12 s; alguns PCs demoram mais para subir: continua acompanhando até ~40 s
  while(!online&&seg()<40){
    await new Promise(ok=>setTimeout(ok,1500));
    try{online=!!(await(await fetch('/api/ollama/status')).json()).online;}catch(e){}
  }
  clearInterval(tick);ollamaIniciando=false;
  if(!online){bannerUI(t('startFail'),{kind:'err',btn:{txt:t('retry'),fn:iniciarOllama}});return;}
  await carregarEstado();
  AtlasUI.toast(t('ollamaReady'),{kind:'ok'});
}

async function baixar(nome,btn,pr){
  const A=AjustesUI.t;btn.disabled=true;btn.textContent=A('dling');pr.style.display='block';const bar=pr.firstChild;bar.style.width='0';
  let erro=null;
  try{const r=await fetch('/api/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modelo:nome})});
    if(r.status===400)erro='manifest';
    if(!r.ok||!r.body)throw new Error('HTTP '+r.status);
    const rd=r.body.getReader();const dc=new TextDecoder();let bf='';
    while(true){const{done,value}=await rd.read();if(done)break;bf+=dc.decode(value,{stream:true});const ls=bf.split('\n');bf=ls.pop();
      for(const l of ls){if(!l.trim())continue;let o;try{o=JSON.parse(l)}catch(_){continue}
        if(o.error){erro=String(o.error);continue;}
        if(o.total){const pc=Math.round((o.completed||0)/o.total*100);bar.style.width=pc+'%';btn.textContent=(o.status||A('dling'))+' '+pc+'%';}
        else if(o.status)btn.textContent=o.status;}}
  }catch(e){erro=erro||A('dlNoOllama');}
  if(erro){
    const low=erro.toLowerCase();
    const msg=/ollama_offline/.test(low)?A('dlNoOllama'):/file does not exist|not found|manifest/.test(low)?A('pullBad'):/no space|disk|espa/.test(low)?A('dlDisk'):/dial|lookup|timeout|no such host|network|connection|ECONN/i.test(erro)?A('dlOffline'):/refused|10061|failed to fetch|HTTP 5/i.test(erro)?A('dlNoOllama'):erro;
    AtlasUI.toast(A('dlErr',{m:nome,e:msg}),{kind:'err'});
    btn.textContent=A('retry');btn.disabled=false;pr.style.display='none';return;
  }
  btn.textContent=t('ready');AtlasUI.toast(A('dlDone',{m:nome}),{kind:'ok'});await carregarEstado();
}

let buscaQ='', buscaT=null;
function grupoData(ts){
  const d=new Date((ts||0)*1000),hoje=new Date();hoje.setHours(0,0,0,0);
  const dias=Math.floor((hoje-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  return dias<=0?'gHoje':dias===1?'gOntem':dias<7?'g7':dias<30?'g30':'gAntes';
}
// trecho da busca com o termo destacado (montado com nós de texto, sem HTML vindo de dados)
function trechoMarcado(txt,q){
  const box=document.createElement('span');box.className='tr';
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const i=q?norm(txt).indexOf(norm(q)):-1;
  if(i<0){box.textContent=txt;return box;}
  const mk=document.createElement('mark');mk.textContent=txt.slice(i,i+q.length);
  box.append(txt.slice(0,i),mk,txt.slice(i+q.length));return box;
}
async function carregarChats(){
  let d;
  try{const r=await fetch('/api/chats'+(buscaQ?'?q='+encodeURIComponent(buscaQ):''));if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json();}
  catch(e){$('#lista').innerHTML='';$('#chat').innerHTML='';vazio();semConexao();return;}
  chatAtual=d.atual;
  const cur=(d.chats||[]).find(c=>c.id===chatAtual);
  if(cur||!buscaQ){AjustesUI.chat.definirProjetoDoChat(cur&&cur.projeto);modeloDoChat=(cur&&cur.modelo)||null;}
  if(estado){renderModelSel();renderBanner();const p=$('#pill');if(estado.ollama_online&&estado.config.ativo!==false)p.textContent=modeloEfetivo();}
  desenharLista(d.chats||[]);
  await abrirMensagens(chatAtual);
}
function desenharLista(lista){
  const L=$('#lista');L.innerHTML='';
  if(!lista.length&&buscaQ){const v=document.createElement('div');v.className='ui-empty';v.textContent=t('noResults');L.appendChild(v);return;}
  let grupo=null;
  for(const c of lista){
    if(!buscaQ){const g=grupoData(c.atualizado);
      if(g!==grupo){grupo=g;const gh=document.createElement('div');gh.className='grp';gh.textContent=t(g);L.appendChild(gh);}}
    const it=document.createElement('div');it.className='item'+(c.id===chatAtual?' sel':'');
    it.innerHTML=`<span class="tx"><span class="tit"></span></span><span class="acts">
      <button class="ic ren" title="${t('ren')}" aria-label="${t('ren')}">✎</button><button class="ic del" title="${t('delBtn')}" aria-label="${t('delBtn')}">🗑</button></span>`;
    it.tabIndex=0;it.setAttribute('role','button');
    if(c.id===chatAtual)it.setAttribute('aria-current','true');
    it.onkeydown=e=>{if(e.target===it&&(e.key==='Enter'||e.key===' ')){e.preventDefault();abrirChat(c.id);}
      if(e.target===it&&e.key==='F2'){e.preventDefault();renomearChat(it,c);}
      if(e.target===it&&e.key==='Delete'){e.preventDefault();excluirChat(c.id);}};
    it.querySelector('.tit').textContent=c.titulo;it.title=c.titulo;
    if(buscaQ&&c.trecho)it.querySelector('.tx').appendChild(trechoMarcado(c.trecho,buscaQ));
    if(c.modelo){const mb=document.createElement('span');mb.className='mdl';mb.textContent=semLatest(c.modelo).split(':')[0].slice(0,14);mb.title=c.modelo;it.insertBefore(mb,it.querySelector('.acts'));}
    it.onclick=e=>{if(e.target.closest('.acts')||e.target.tagName==='INPUT')return;abrirChat(c.id);};
    it.querySelector('.ren').onclick=e=>{e.stopPropagation();renomearChat(it,c);};
    it.querySelector('.del').onclick=e=>{e.stopPropagation();excluirChat(c.id);};
    L.appendChild(it);
  }
}

  const sug=t('sug');
  if(Array.isArray(sug)){

function renomearChat(it,c){
  const tit=it.querySelector('.tit');const inp=document.createElement('input');inp.value=c.titulo;inp.maxLength=80;
  tit.replaceWith(inp);inp.focus();inp.select();let feito=false;
  const salvar=async()=>{if(feito)return;feito=true;
    const v=inp.value.trim();
    if(v&&v!==c.titulo)await fetch('/api/chats/'+c.id+'/renomear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:v})});
    await carregarChats();};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')salvar();if(e.key==='Escape'){feito=true;carregarChats();}};inp.onblur=salvar;
  inp.onclick=e=>e.stopPropagation();
}

// ── mensagens ──
// rolagem automática: segue o fim só enquanto o usuário não sobe a conversa
let grudado=true;
const chatEl=$('#chat');
function pertoDoFim(){return chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight<80;}
function rolarFim(forcar){if(forcar||grudado){chatEl.scrollTop=chatEl.scrollHeight;grudado=true;}$('#descer').classList.toggle('on',!grudado);}
chatEl.addEventListener('scroll',()=>{grudado=pertoDoFim();$('#descer').classList.toggle('on',!grudado&&chatEl.scrollHeight>chatEl.clientHeight+40);},{passive:true});
$('#descer').onclick=()=>{chatEl.scrollTo({top:chatEl.scrollHeight,behavior:'smooth'});grudado=true;$('#descer').classList.remove('on');};

// devolve {msg, bubble, body}; o corpo é onde o texto/markdown vai
function addMsg(role,texto,comMd,imgs){
  const e=$('#chat .empty');if(e)e.remove();
  const m=document.createElement('div');m.className='msg '+role;
  m.innerHTML=`<div class="av ${role==='user'?'u':'a'}">${role==='user'?'eu':'◆'}</div><div class="mcol"><div class="bubble"></div></div>`;
  const bub=m.querySelector('.bubble');
  if(imgs&&imgs.length){const box=document.createElement('div');box.className='imgs';
    for(const u of imgs){const im=document.createElement('img');im.src=u;im.alt='';box.appendChild(im);}bub.appendChild(box);}
  const body=document.createElement('div');body.className='body';
  if(comMd){bub.classList.add('md');body.innerHTML=md(texto||'');}
  else body.textContent=texto||'';
  bub.appendChild(body);
  chatEl.appendChild(m);rolarFim();
  return {msg:m,bubble:bub,body:body};
}
// ações sob a resposta: copiar + aviso de resposta interrompida
function acoesResposta(r,texto,parcial){
  const col=r.msg.querySelector('.mcol');let a=col.querySelector('.mact');if(a)a.remove();
  a=document.createElement('div');a.className='mact';
  if(texto){const cp=document.createElement('button');cp.type='button';cp.textContent='⧉ '+t('copy');cp.title=t('copyMsg');cp.setAttribute('aria-label',t('copyMsg'));
    cp.onclick=()=>AtlasMD.copiar(texto).then(()=>{cp.textContent='✓ '+t('copied');setTimeout(()=>cp.textContent='⧉ '+t('copy'),1400);});
    a.appendChild(cp);}
  if(parcial){const tg=document.createElement('span');tg.className='tag parcial';tg.textContent='⏹ '+t('partial');a.appendChild(tg);}
  if(a.children.length)col.appendChild(a);
}
function modoStop(on){const b=$('#send');b.disabled=false;
  if(on){b.textContent='■';b.classList.add('stop');b.title=t('stop');b.setAttribute('aria-label',t('stop'));b.onclick=pararGeracao;}
  else{b.textContent='➤';b.classList.remove('stop');b.title=t('enviar');b.setAttribute('aria-label',t('enviar'));b.onclick=enviar;}}
function pararGeracao(){if(ctrl)ctrl.abort();}
async function enviar(){
  const inp=$('#input'),texto=inp.value.trim();if((!texto&&!anexos.length)||ocupado)return;
  const envs=anexos.slice();inp.value='';inp.style.height='auto';clearAnexos();
  await enviarTexto(texto,envs);
}
async function enviarTexto(texto,envs){
  envs=envs||[];
  if(!estado.ollama_online){const r=addMsg('a',t('errOllama'),true);renderBanner();return r;}
  if(!instaladoNome(modeloEfetivo())){addMsg('a',modelosChatInstalados().length?t('errModel',{m:modeloEfetivo()}):t('noModel'),true);return;}
  ultimaPergunta=texto;ocupado=true;modoStop(true);$('#chatActions').style.display='none';
  const imgsURL=envs.filter(a=>a.tipo==='img').map(a=>a.dataURL);
  const arqNomes=envs.filter(a=>a.tipo==='arq').map(a=>a.nome);
  let disp=texto; if(arqNomes.length)disp=(disp?disp+'\n':'')+arqNomes.map(n=>'📄 '+n).join('\n');
  addMsg('user',disp,false,imgsURL);rolarFim(true);
  const corpo={texto,chat_id:chatAtual,
    imagens:envs.filter(a=>a.tipo==='img').map(a=>a.dataURL),
    anexos:envs.filter(a=>a.tipo==='arq').map(a=>({nome:a.nome,b64:a.dataURL}))};
  const r=addMsg('a','',true);const body=r.body;
  body.innerHTML='<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
  let acc='',infoCtx=null,abortado=false,pend=false;ctrl=new AbortController();
  // markdown durante o streaming, no máximo uma vez por quadro
  const pintar=()=>{pend=false;body.innerHTML=md(acc);rolarFim();};
  try{const resp=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo),signal:ctrl.signal});
    infoCtx=AjustesUI.chat.parseHeader(resp.headers.get('X-Atlas-Contexto'));
    const rd=resp.body.getReader(),dc=new TextDecoder();
    r.bubble.classList.add('streaming');
    while(true){const{done,value}=await rd.read();if(done)break;acc+=dc.decode(value,{stream:true});
      if(!pend){pend=true;requestAnimationFrame(pintar);}}
  }catch(e){if(e.name==='AbortError')abortado=true;else acc+='\n\n'+t('errStream');}
  r.bubble.classList.remove('streaming');
  body.innerHTML=md(acc);
  if(infoCtx&&infoCtx.mems&&infoCtx.mems.length)AjustesUI.chat.usadas(body,infoCtx.mems,infoCtx);
  acoesResposta(r,acc,abortado&&!!acc.trim());
  rolarFim();
  ocupado=false;ctrl=null;modoStop(false);$('#input').focus();$('#chatActions').style.display='block';
  if(!buscaQ)fetch('/api/chats').then(x=>x.json()).then(d=>desenharLista(d.chats||[])).catch(()=>{});
}
async function regenerar(){
  if(ocupado||!chatAtual)return;
  const r=await(await fetch('/api/chats/'+chatAtual+'/regenerar',{method:'POST'})).json();
  const texto=r.texto||ultimaPergunta;if(!texto)return;
  const msgs=[...$('#chat').querySelectorAll('.msg')];
  if(msgs.length)msgs[msgs.length-1].remove();
  if(msgs.length>=2)msgs[msgs.length-2].remove();
  await enviarTexto(texto);
}
$('#send').onclick=enviar;
$('#regenBtn').onclick=regenerar;

// ── anexos (imagens e arquivos) ──
function clearAnexos(){anexos=[];renderAnexos();}
function renderAnexos(){
  const bar=$('#anexosBar');bar.innerHTML='';bar.style.display=anexos.length?'flex':'none';
  anexos.forEach((a,i)=>{const c=document.createElement('div');c.className='anexo';
    if(a.tipo==='img'){const im=document.createElement('img');im.src=a.dataURL;c.appendChild(im);}
    else{const e=document.createElement('span');e.textContent='📄';c.appendChild(e);}
    const nm=document.createElement('span');nm.className='nm';nm.textContent=a.nome;c.appendChild(nm);
    const x=document.createElement('span');x.className='x';x.textContent='✕';x.onclick=()=>{anexos.splice(i,1);renderAnexos();};c.appendChild(x);
    bar.appendChild(c);});
}
function addArquivo(file){
  if(!file)return; if(file.size>16*1024*1024){AtlasUI.toast(t('tooBig'),{kind:'err'});return;}
  const tipo=file.type&&file.type.startsWith('image/')?'img':'arq';
  const fr=new FileReader();
  fr.onload=()=>{anexos.push({tipo,nome:file.name||('imagem.'+((file.type||'image/png').split('/')[1]||'png')),dataURL:fr.result});renderAnexos();};
  fr.readAsDataURL(file);
}
$('#attachBtn').onclick=()=>$('#anexoFile').click();
$('#anexoFile').onchange=e=>{[...e.target.files].forEach(addArquivo);e.target.value='';};
$('#input').addEventListener('paste',e=>{const its=e.clipboardData&&e.clipboardData.items;if(!its)return;
  for(const it of its){if(it.kind==='file'){const f=it.getAsFile();if(f){addArquivo(f);e.preventDefault();}}}});
['dragover','dragenter'].forEach(ev=>$('#chat').addEventListener(ev,e=>{e.preventDefault();$('#chat').classList.add('drag');}));
['dragleave','drop'].forEach(ev=>$('#chat').addEventListener(ev,e=>{e.preventDefault();$('#chat').classList.remove('drag');}));
$('#chat').addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)[...e.dataTransfer.files].forEach(addArquivo);});

// ── Tesseract OCR (instalar/desinstalar pelo menu) ──
async function instalarOCR(btn){btn.disabled=true;btn.textContent=t('ocrInstalling');
  try{const r=await fetch('/api/tesseract/install',{method:'POST'});const rd=r.body.getReader();const dc=new TextDecoder();let bf='';
    while(true){const{done,value}=await rd.read();if(done)break;bf+=dc.decode(value,{stream:true});const ls=bf.split('\n');bf=ls.pop();
      for(const l of ls){if(!l.trim())continue;let o;try{o=JSON.parse(l)}catch(_){continue}
        if(o.status)btn.textContent=o.status;if(o.error)btn.textContent='erro: '+o.error;}}
    await carregarEstado();
  }catch(e){btn.textContent='erro';btn.disabled=false;}
}
async function desinstalarOCR(btn){if(!await conf(t('ocrConfirm'),{ok:t('uninstBtn'),danger:true}))return;btn.disabled=true;btn.textContent=t('ocrInstalling');
  try{await fetch('/api/tesseract/uninstall',{method:'POST'});}catch(e){}await carregarEstado();
}
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}});
$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';});
$('#novoChat').onclick=novoChat;
$('#toggleSide').onclick=()=>{const h=$('#side').classList.toggle('hide');document.body.classList.toggle('side-open',!h&&ehMobile());};
$('#sideScrim').onclick=fecharSideMobile;
if(ehMobile())$('#side').classList.add('hide');
$('#themeBtn').onclick=()=>{TEMA=TEMA==='escuro'?'claro':'escuro';aplicarTema();salvarConfig({tema:TEMA});};
$('#powerBtn').onclick=()=>{const a=estado.config.ativo!==false;salvarConfig({ativo:!a});};
$('#lockBtn').onclick=()=>{const co=estado.cofre||{};if(co.desbloqueado)bloquearCofre();else abrirCofreModal();};
$('#cofreOk').onclick=desbloquearCofre;
$('#cofreSenha').addEventListener('keydown',e=>{if(e.key==='Enter')desbloquearCofre();});
$('#abrirPasta').onclick=()=>fetch('/api/abrir_pasta',{method:'POST'});
$('#btnExport').onclick=exportarBackup;
$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{importarBackup(e.target.files[0]);e.target.value='';};
let _focoAntes=null;
function abrirCfg(){_focoAntes=document.activeElement;$('#cfg').classList.add('open');$('#scrim').style.display='block';setTimeout(()=>$('#cfgClose').focus(),30);}
$('#gear').onclick=abrirCfg;
function fechar(){$('#cfg').classList.remove('open');$('#scrim').style.display='none';if(_focoAntes&&_focoAntes.focus)_focoAntes.focus();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#cfg').classList.contains('open')&&!document.querySelector('.ui-back'))fechar();});
$('#cfgClose').onclick=fechar;$('#scrim').onclick=fechar;

try{const es=new EventSource('/eventos');es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(_){return}
  if(m.tipo==='iniciativa'&&m.payload)addMsg('a',m.payload,true);
  if(m.tipo==='sugestao_fato')AjustesUI.chat.sugestao(m.payload);};}catch(e){}

async function atualizarSistema(){
  try{const s=await(await fetch('/api/sistema')).json();const p=[];
    if(s.vram_total)p.push('🎮 '+(s.vram_usada/1024).toFixed(1)+'/'+(s.vram_total/1024).toFixed(1)+'GB');
    if(s.cpu!=null)p.push('CPU '+s.cpu+'%');
    if(s.ram_total){p.push('RAM '+s.ram_pct+'%');const gb=s.ram_total/1073741824;if(Math.abs((hostAj.ramTotalGB||0)-gb)>0.05){hostAj.ramTotalGB=gb;if(estado)AjustesUI.render();}}
    $('#sysPill').textContent=p.join('  ');
  }catch(e){$('#sysPill').textContent='';}
}
const hostAj={estado:()=>estado,salvar:salvarConfig,conf:conf,baixar:baixar,excluir:excluirModelo,chat:()=>chatAtual,seg:seg,setEstado:aplicarEstado,ramTotalGB:0,
  iniciarOllama:()=>{fechar();iniciarOllama();}};
AjustesUI.init(hostAj);
(async()=>{await carregarEstado();await carregarChats();AjustesUI.chat.carregarProjetos();})();
// não recarrega o estado com o painel de ajustes aberto (isso apagava a senha digitada)
setInterval(()=>{if(!ocupado&&!$('#cfg').classList.contains('open'))carregarEstado();},10000);
atualizarSistema();setInterval(atualizarSistema,3000);
</script>
