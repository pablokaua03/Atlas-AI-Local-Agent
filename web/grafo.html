<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/ui.css">
<style>
  :root{color-scheme:dark;--bg:#07090d;--panel:rgba(18,22,30,.86);--panel2:#141925;--line:#232a38;--txt:#e6e9ef;--dim:#8b94a3;--accent:#7c9bff;--danger:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:13px}
  canvas{position:fixed;inset:0;top:54px;display:block;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;
    border-bottom:1px solid var(--line);background:rgba(7,9,13,.82);backdrop-filter:blur(8px);z-index:5}
  #top h1{font-size:15px;margin:0 4px 0 0;white-space:nowrap} #stats{font-size:12px;color:var(--dim);white-space:nowrap}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:3px}
  .seg button{background:none;border:none;color:var(--dim);padding:5px 12px;border-radius:18px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:linear-gradient(135deg,#7c9bff,#b07cff);color:#fff;box-shadow:0 0 14px rgba(124,155,255,.45)}
  .tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .tbtn:hover{border-color:var(--accent)} .tbtn.on{background:var(--accent);color:#07090d;border-color:var(--accent)}
  .sp{flex:1}
  #buscaW{position:relative}
  #busca{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 12px;width:190px;outline:none}
  #busca:focus{border-color:var(--accent)}
  #res{position:fixed;width:300px;max-height:min(360px,60vh);overflow:auto;background:rgba(14,18,26,.97);border:1px solid var(--line);
    border-radius:12px;padding:5px;z-index:9;display:none;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #res .r{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px;color:#dfe4ee}
  #res .r i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  #res .r .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #res .r .t{font-size:11px;color:var(--dim);flex:0 0 auto}
  #res .r.on,#res .r:hover{background:var(--panel2)} #res .r.on{outline:1px solid var(--accent)}
  #res .n{font-size:11px;color:var(--dim);padding:4px 9px 6px}
  select.tbtn{padding-right:8px}
  label.chk{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
  #painel{position:fixed;right:14px;top:66px;width:300px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:14px;z-index:6;display:none;backdrop-filter:blur(10px);
    box-shadow:0 12px 50px rgba(0,0,0,.55)}
  #painel .x{position:absolute;top:8px;right:10px;color:var(--dim);cursor:pointer;background:none;border:none;font-size:16px}
  #painel .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px}
  #painel input,#painel select,#painel textarea{width:100%;background:#0c1017;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;outline:none}
  #painel textarea{resize:vertical;min-height:58px;line-height:1.45}
  #painel input:focus,#painel select:focus,#painel textarea:focus{border-color:var(--accent)}
  #painel h3{margin:0 24px 2px 0;font-size:16px} #painel .sub{font-size:12px;color:var(--dim)}
  #painel .txt{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .chip{display:inline-block;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px 8px;margin:2px 3px 2px 0;cursor:pointer;color:#cdd3dd}
  .chip:hover{border-color:var(--accent)}
  .conx{font-size:12.5px;color:#cdd3dd;display:flex;align-items:center;gap:6px;padding:3px 0}
  .conx button{margin-left:auto;background:none;border:none;color:var(--danger);cursor:pointer}
  .mem{font-size:12.5px;color:#cdd3dd;border-left:2px solid var(--line);padding:3px 0 3px 8px;margin:4px 0;cursor:pointer}
  .mem:hover{border-color:var(--accent)} .mem .m{font-size:10.5px;color:var(--dim)}
  .eb{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:8px;cursor:pointer;font-weight:600;margin-top:7px}
  .eb:hover{border-color:var(--accent)} .eb.pri{color:var(--accent);border-color:var(--accent)} .eb.del{background:var(--danger);border-color:var(--danger);color:#fff}
  #legenda{position:fixed;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    font-size:11.5px;z-index:4;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:60%;backdrop-filter:blur(8px)}
  #legenda span{display:flex;align-items:center;gap:5px;cursor:pointer;color:#cdd3dd;user-select:none}
  #legenda span.off{opacity:.3} #legenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
  #legenda i.dia{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
  #legenda .nota{cursor:default;color:var(--dim);flex-basis:100%}
  #zoom{position:fixed;right:14px;bottom:40px;display:flex;flex-direction:column;gap:6px;z-index:4}
  #zoom button{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:16px;backdrop-filter:blur(8px)}
  #zoom button:hover{border-color:var(--accent)}
  #ajuda{position:fixed;right:60px;bottom:14px;font-size:11.5px;color:var(--dim);z-index:3;text-align:right;pointer-events:none}
  #tip{position:fixed;pointer-events:none;background:rgba(10,13,19,.94);border:1px solid var(--line);border-radius:10px;padding:7px 10px;
    font-size:12px;max-width:280px;z-index:8;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip b{display:block;margin-bottom:2px} #tip .d{color:var(--dim)}
  #hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);
    color:var(--txt);border-radius:20px;padding:8px 16px;font-size:13px;display:none;z-index:7}
  #vazio{position:fixed;inset:54px 0 0 0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim);text-align:center;padding:30px;pointer-events:none}
  #top{overflow-x:auto;overflow-y:hidden;scrollbar-width:none} #top::-webkit-scrollbar{display:none} #top>*{flex-shrink:0}
  #legenda #legStats{display:none}
  @media (max-width:1560px){#stats{display:none} #legenda #legStats{display:inline}}
  @media (max-width:980px){#busca{width:130px}}
  #carregando{position:fixed;inset:54px 0 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    color:var(--dim);font-size:13px;z-index:2;pointer-events:none}
  #carregando .ui-skel{width:min(260px,70%);height:10px}
  .tbtn,.eb,.seg button{min-height:34px}
  .tbtn:focus-visible,.seg button:focus-visible,.eb:focus-visible,#legenda span:focus-visible,#zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:680px){
    #top{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:6px;padding:0 10px}
    #top::-webkit-scrollbar{display:none}
    #top>*{flex-shrink:0}
    #top h1{font-size:14px}
    #painel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:55%}
    #legenda{max-width:calc(100% - 20px);bottom:auto;top:62px;left:10px;font-size:11px}
    #legenda .nota{display:none}
    #ajuda{display:none}
    #zoom{bottom:16px;right:10px}
    #res{width:calc(100% - 20px)}
  }
</style>
</head>

<div id="top">
  <h1 data-i="h1">🕸️ Grafo</h1><span id="stats"></span>
  <div class="seg" id="modos">

  <div class="sp"></div>
  <button class="tbtn" id="novoNo" data-it="novo">➕</button>
  <button class="tbtn" id="conectar" data-it="conectar">🔗</button>
  <button class="tbtn" id="centrar" data-it="centrar">⊙</button>
  <button class="tbtn" id="limpar" data-it="limpar" style="color:var(--danger)">🧹</button>
  <a class="tbtn" href="/memorias" style="text-decoration:none" data-it="memLink">🗂️</a>
  <a class="tbtn" href="/" style="text-decoration:none" data-i="voltar">← voltar</a>
</div>
<canvas id="cv"></canvas>
<div id="res" role="listbox"></div>
<div id="painel"></div>
<div id="legenda"></div>
<div id="zoom"><button id="zIn" data-it="zoomIn">+</button><button id="zOut" data-it="zoomOut">−</button></div>
<div id="ajuda"></div>
<div id="tip"></div>
<div id="hint"></div>

function chaveNo(e){if(porK[e]&&!porK[e].mem)return e;const l=norm(e);return porK[l]&&!porK[l].mem?l:null;}
function reconstruir(){

  const ns=G.nos||{},ks=Object.keys(ns).filter(k=>(!incl||(ns[k].projetos||[]).some(p=>incl.has(p)))&&!OCULTOS.has(ns[k].tipo||'tema'));
  const old=porK;porK={};
  const conceitos=ks.map(k=>{const o=old[k],n=ns[k];const disp=(n.t&&n.t[LANGG])||n.label;
    return porK[k]={k,label:n.label,disp,tipo:n.tipo||'tema',peso:n.peso||1,projetos:n.projetos||[],desc:n.descricao||'',fixo:!!n.fixo,
      busca:norm(disp+' '+n.label+' '+k),x:o?o.x:(Math.random()-.5)*400,y:o?o.y:(Math.random()-.5)*400,z:o?o.z:(Math.random()-.5)*400,vx:0,vy:0,vz:0};});
  arestas=Object.values(G.arestas||{}).filter(a=>porK[a.de]&&porK[a.para]).map(a=>({...a,A:porK[a.de],B:porK[a.para],hier:!!a.hierarquia}));
  const deg={};for(const a of arestas){deg[a.de]=(deg[a.de]||0)+1;deg[a.para]=(deg[a.para]||0)+1;}
  for(const n of conceitos){n.grau=deg[n.k]||0;n.r=4+Math.min(20,Math.sqrt(n.grau*1.6+n.peso)*3.2)+(n.tipo==='projeto'?3:0);}
  // memórias como nós satélite, ligadas às entidades que mencionam

    for(const m of MEMS){if(memNos.length>=MAX_MEM_NOS)break;
      if(incl&&!incl.has(m.project))continue;
      const alvos=[...new Set((m.entities||[]).map(chaveNo).filter(Boolean))];if(!alvos.length)continue;
      const k='m:'+m.id,o=old[k],b=porK[alvos[0]];

        r:2.6+(m.importance||3)*.7,busca:norm(m.content),
        x:o?o.x:b.x+(Math.random()-.5)*80,y:o?o.y:b.y+(Math.random()-.5)*80,z:o?o.z:b.z+(Math.random()-.5)*80,vx:0,vy:0,vz:0};

// ── hierarquia (árvore radial: geral → projetos → subprojetos → memórias) ──
function montarHier(){
  const oldPos={};for(const h of hnos)oldPos[h.id]={x:h.x,y:h.y};
  hnos=[];hlig=[];if(!ARVORE)return;
  const memPor={};for(const m of MEMS)(memPor[m.project]=memPor[m.project]||[]).push(m);
  const achar=(n,id)=>{if(n.id===id)return n;for(const c of n.children){const r=achar(c,id);if(r)return r;}return null;};
  const raiz=PROJ?(achar(ARVORE,PROJ)||ARVORE):ARVORE;
  const MAXM=14;
  function construir(p,depth,pai){
    const h={id:'p:'+p.id,kind:depth===0&&p.id==='geral'?'root':'proj',label:p.id==='geral'?tr('memGeral'):p.name,data:p,depth,pai,filhos:[]};
    hnos.push(h);if(pai){pai.filhos.push(h);hlig.push({A:pai,B:h,kind:'proj'});}
    for(const c of p.children)construir(c,depth+1,h);
    const ms=(memPor[p.id]||[]);
    for(const m of ms.slice(0,MAXM)){const f={id:'m:'+m.id,kind:'mem',label:m.content,data:m,depth:depth+1,pai:h,filhos:[]};
      hnos.push(f);h.filhos.push(f);hlig.push({A:h,B:f,kind:'mem'});}
    if(ms.length>MAXM){const f={id:'x:'+p.id,kind:'mais',label:tr('maisMem',{n:ms.length-MAXM}),data:p,depth:depth+1,pai:h,filhos:[]};
      hnos.push(f);h.filhos.push(f);hlig.push({A:h,B:f,kind:'mem'});}
    return h;
  }
  const r=construir(raiz,0,null);
  // folhas por subárvore → fatia do ângulo proporcional
  const folhas=h=>h.nf=h.filhos.length?h.filhos.reduce((a,f)=>a+folhas(f),0):1;folhas(r);
  const RAIO=[0,170,300,410,500,580,650];
  const raio=d=>RAIO[Math.min(d,RAIO.length-1)]+(d>=RAIO.length?(d-RAIO.length+1)*70:0);
  function posicionar(h,a0,a1){
    const a=(a0+a1)/2;h.ang=a;
    const rr=h.kind==='mem'||h.kind==='mais'?raio(h.depth-1)+Math.max(70,(raio(h.depth)-raio(h.depth-1))*.62):raio(h.depth);
    h.tx=Math.cos(a)*rr;h.ty=Math.sin(a)*rr;
    let c=a0;for(const f of h.filhos){const fatia=(a1-a0)*f.nf/h.nf;posicionar(f,c,c+fatia);c+=fatia;}
  }
  posicionar(r,-Math.PI/2,Math.PI*1.5);r.tx=0;r.ty=0;
  for(const h of hnos){const o=oldPos[h.id];const p=h.pai&&oldPos[h.pai.id];h.x=o?o.x:(p?p.x:0);h.y=o?o.y:(p?p.y:0);
    const tot=h.data&&h.data.total_memories||0;h.busca=norm(h.label);
    h.r=h.kind==='root'?20:h.kind==='proj'?9+Math.min(14,Math.sqrt(tot)*3):h.kind==='mais'?5:3.5+(h.data.importance||3)*.8;
    h.cor=h.kind==='root'?'#b07cff':h.kind==='proj'?CORES.projeto:h.kind==='mais'?'#5b6475':(CORES_MEM[h.data.type]||'#9aa4b5');}
}

// ── física (rede 2D e órbita 3D); repulsão só entre vizinhos de grade (corte de 500px) ──
const CEL=500;
function passo(){
  if(alpha<0.004&&!dragNo)return;
  const tres=MODO==='orbita',k=tres?2600:1500,grade=new Map();
  for(const n of nos){const c=(Math.floor(n.x/CEL)+512)*4096+(Math.floor(n.y/CEL)+512);let l=grade.get(c);if(!l)grade.set(c,l=[]);l.push(n);n._c=c;}
  for(const n of nos){let fx=0,fy=0,fz=0;const kn=n.mem?k*.35:k;
    for(let dx0=-1;dx0<=1;dx0++)for(let dy0=-1;dy0<=1;dy0++){const l=grade.get(n._c+dx0*4096+dy0);if(!l)continue;
      for(const m of l){if(m===n)continue;const dx=n.x-m.x,dy=n.y-m.y,dz=tres?n.z-m.z:0,d2=dx*dx+dy*dy+dz*dz+.01;
        if(d2>250000)continue;const f=(m.mem?kn*.35:kn)/d2;fx+=dx*f;fy+=dy*f;fz+=dz*f;}}
    fx-=n.x*.012;fy-=n.y*.012;fz-=(tres?n.z*.012:n.z*.2);
    n.vx=(n.vx+fx*alpha)*.78;n.vy=(n.vy+fy*alpha)*.78;n.vz=(n.vz+fz*alpha)*.78;}
  for(const a of arestas){const dx=a.B.x-a.A.x,dy=a.B.y-a.A.y,dz=tres?a.B.z-a.A.z:0,d=Math.hypot(dx,dy,dz)+.01;
    const alvo=a.mem?46:a.hier?110:85,f=(d-alvo)*(a.mem?.03:.02)*alpha,ux=dx/d,uy=dy/d,uz=dz/d;
    a.A.vx+=ux*f;a.A.vy+=uy*f;a.A.vz+=uz*f;if(!a.mem){a.B.vx-=ux*f;a.B.vy-=uy*f;a.B.vz-=uz*f;}}
  for(const n of nos){if(n===dragNo)continue;const c=v=>clamp(v,-12,12);n.x+=c(n.vx);n.y+=c(n.vy);n.z+=c(n.vz);}
  alpha=Math.max(0,alpha*.994);
}

// ── projeções ──
const V=p=>({x:p.x*view.k+view.x,y:p.y*view.k+view.y});
const IV=(x,y)=>({x:(x-view.x)/view.k,y:(y-view.y)/view.k});
function proj3(n){
  const cy=Math.cos(cam.ry),sy=Math.sin(cam.ry),cx=Math.cos(cam.rx),sx=Math.sin(cam.rx);
  let x=n.x*cy-n.z*sy,z=n.x*sy+n.z*cy,y=n.y*cx-z*sx;z=n.y*sx+z*cx;
  const f=cam.dist/(cam.dist+z+400);return {x:W/2+x*f,y:H/2+y*f,s:f,z};
}
function centralizar(){
  sujo=true;anim=null;
  const pts=MODO==='hier'?hnos.map(h=>({x:h.tx,y:h.ty})):nos;
  if(MODO==='orbita'){cam.dist=clamp(Math.sqrt(nos.length)*190,500,2400);return;}
  if(!pts.length)return;let a=1e9,b=1e9,c=-1e9,e=-1e9;
  for(const n of pts){a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x);e=Math.max(e,n.y);}
  view.k=clamp(Math.min(W/((c-a)+200),H/((e-b)+160)),.25,1.5);
  view.x=W/2-((a+c)/2)*view.k;view.y=H/2-((b+e)/2)*view.k;
}
function focar(x,y,k){k=k||view.k;anim={x:W/2-x*k,y:H/2-y*k,k};sujo=true;}
function zoomPor(f,mx,my){
  sujo=true;anim=null;
  if(MODO==='orbita'){cam.dist=clamp(cam.dist/f,250,4000);return;}
  mx=mx??W/2;my=my??H/2;const w=IV(mx,my);view.k=clamp(view.k*f,.15,4);view.x=mx-w.x*view.k;view.y=my-w.y*view.k;

// ── desenho (nós pré-renderizados em sprites: brilho sem shadowBlur a cada quadro) ──
let T=0;
const SPR=new Map(),SPR_R=20,SPR_T=96;
function sprite(cor){
  let s=SPR.get(cor);if(s)return s;
  s=document.createElement('canvas');s.width=s.height=SPR_T;const g=s.getContext('2d'),c=SPR_T/2;
  g.shadowColor=cor;g.shadowBlur=16;g.fillStyle=cor;g.beginPath();g.arc(c,c,SPR_R,0,7);g.fill();g.shadowBlur=0;
  const gr=g.createRadialGradient(c-SPR_R*.35,c-SPR_R*.35,SPR_R*.1,c,c,SPR_R);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(.25,cor);gr.addColorStop(1,cor);
  g.fillStyle=gr;g.beginPath();g.arc(c,c,SPR_R,0,7);g.fill();
  SPR.set(cor,s);return s;
}
function fundo(){
  if(!fundoG){fundoG=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);fundoG.addColorStop(0,'#101624');fundoG.addColorStop(1,'#05070b');}
  ctx.fillStyle=fundoG;ctx.fillRect(0,0,W,H);
  if(MODO==='orbita'){for(const s of estrelas){const tw=.35+.35*Math.sin(T*.02+s.t);ctx.fillStyle=`rgba(180,200,255,${tw*s.z})`;
      ctx.fillRect((s.x*.5+.5)*W+Math.sin(cam.ry)*s.z*30,(s.y*.5+.5)*H,1.4,1.4);}}
  else{const passoG=36*view.k;if(passoG>10){ctx.fillStyle='rgba(120,140,190,.07)';
      for(let x=((view.x%passoG)+passoG)%passoG;x<W;x+=passoG)for(let y=((view.y%passoG)+passoG)%passoG;y<H;y+=passoG)ctx.fillRect(x,y,1.2,1.2);}}
}
function combina(k){if(!BUSCA)return false;const n=porK[k];return !!n&&n.busca.includes(BUSCA);}
function foco(){  // conjunto destacado (hover/seleção → vizinhança)
  const alvo=hover&&hover.k?hover.k:(sel&&sel.kind==='no'?sel.id:(sel&&sel.kind==='mem'&&porK['m:'+sel.id]?'m:'+sel.id:null));
  if(!alvo||!porK[alvo])return null;return new Set([alvo,...(viz[alvo]||[])]);
}
function desenharNo(p,r,cor,n,dim,destaque){

  if(n&&n.mem){ctx.fillStyle=cor;ctx.beginPath();ctx.moveTo(p.x,p.y-r*1.25);ctx.lineTo(p.x+r*1.25,p.y);ctx.lineTo(p.x,p.y+r*1.25);ctx.lineTo(p.x-r*1.25,p.y);ctx.closePath();ctx.fill();
    if(n.mem.pinned){ctx.strokeStyle='#ff7ab6';ctx.lineWidth=1.2;ctx.stroke();}}
  else if(r<1.6){ctx.fillStyle=cor;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);}
  else{const e=(destaque?1.18:1)*r*SPR_T/(SPR_R*2);ctx.drawImage(sprite(cor),p.x-e,p.y-e,e*2,e*2);}
  if(n&&n.tipo==='projeto'){ctx.strokeStyle=cor;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,7);ctx.stroke();}
  if(destaque){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r+2.5,0,7);ctx.stroke();}
  ctx.globalAlpha=1;

function rotulo(txt,x,y,tam,dim,forte){
  ctx.globalAlpha=dim?.2:1;ctx.font=(forte?'600 ':'')+tam+'px system-ui';ctx.textAlign='center';
  if(forte){const w=ctx.measureText(txt).width+12;ctx.fillStyle='rgba(7,9,13,.8)';ctx.beginPath();
    ctx.roundRect?ctx.roundRect(x-w/2,y-tam+1,w,tam+7,8):ctx.rect(x-w/2,y-tam+1,w,tam+7);ctx.fill();}
  ctx.fillStyle=forte?'#fff':'#dfe4ee';ctx.fillText(txt,x,y+2);ctx.globalAlpha=1;
}
const corNo=n=>n.mem?(CORES_MEM[n.mem.type]||'#9aa4b5'):corTipo(n.tipo);
function particula(p1,p2,cor,vel,off){animPart=true;const t=((T*vel+off)%100)/100;ctx.fillStyle=cor;ctx.beginPath();
  ctx.arc(p1.x+(p2.x-p1.x)*t,p1.y+(p2.y-p1.y)*t,1.8,0,7);ctx.fill();}

function desenharRede(){
  const F=foco(),muitas=arestas.length>300,lw=Math.min(1.4,view.k);
  for(const a of arestas){const p1=V(a.A),p2=V(a.B),on=F&&F.has(a.de)&&F.has(a.para);
    if(Math.max(p1.x,p2.x)<-20||Math.min(p1.x,p2.x)>W+20||Math.max(p1.y,p2.y)<-20||Math.min(p1.y,p2.y)>H+20)continue;
    const dim=(F&&!on)||(BUSCA&&!on);
    if(a.mem){ctx.globalAlpha=dim?.04:(on?.8:.22);ctx.strokeStyle=on?'#fff':corNo(a.A);ctx.lineWidth=.8*lw;}
    else{ctx.globalAlpha=dim?.05:(on?.9:(a.hier?.55:.28));
      if(muitas&&!on)ctx.strokeStyle=corTipo(a.A.tipo);
      else{const g=ctx.createLinearGradient(p1.x,p1.y,p2.x,p2.y);g.addColorStop(0,corTipo(a.A.tipo));g.addColorStop(1,corTipo(a.B.tipo));ctx.strokeStyle=g;}
      ctx.lineWidth=(a.hier?2:(.7+Math.min(a.peso||1,6)*.35))*lw;}

  for(const m of ms.slice(0,15))mems.append(cartaoMem(m));
  const trilha=(full.path||[]).map(x=>x.name).join(' › ');
  painel(el('h3',{textContent:p.id==='geral'?tr('memGeral'):p.name}),el('div',{className:'sub',textContent:trilha}),
    p.description?el('div',{className:'txt',style:'margin-top:8px',textContent:p.description}):null,
    el('div',{className:'sub',style:'margin-top:8px',textContent:tr('projInfo',{a:p.memories,b:p.total_memories,c:p.nodes})}),
    p.id!=='geral'?el('div',{className:'sub',textContent:tr('herda',{c:(full.path||[]).slice(0,-1).map(x=>x.name).reverse().join(' → ')||tr('geral')})}):null,
    lbl(tr('memorias')),mems,
    p.id!=='geral'?el('button',{className:'eb pri',textContent:tr('verRede'),onclick:()=>{PROJ=p.id;$('#projSel').value=p.id;window._centrou=false;trocarModo('rede');}}):null,
    el('button',{className:'eb',textContent:tr('novoSub'),onclick:()=>novoProjeto(p.id==='geral'?null:p.id)}),
    el('button',{className:'eb',textContent:tr('abrirMem'),onclick:()=>location.href='/memorias#'+encodeURIComponent(p.id)}));
}
async function novoProjeto(pai){
  if(!TK)return;
  const nome=await AtlasUI.prompt({title:pai?tr('novoSubT'):tr('novoProjT'),label:pai?tr('nomeSub'):tr('nomeProj'),okText:tr('criar'),maxLength:80});
  if(!nome)return;
  try{await api('POST','/projects',{name:nome,parent:pai});await carregar();}catch(e){AtlasUI.toast(tr('erro',{e:e.message}),{kind:'err'});}
}

// ── edição (mesmos endpoints da interface) ──
async function editar(body){
  try{const r=await fetch('/api/grafo/editar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);}
  catch(e){AtlasUI.toast(tr('salvarErr'),{kind:'err'});}
  await carregar();
  if(sel&&sel.kind==='no'&&porK[sel.id])painelNo(sel.id);}
function hint(t){const h=$('#hint');h.textContent=t||'';h.style.display=t?'block':'none';}
function sairConectar(){connectMode=false;connectFrom=null;hint('');$('#conectar').classList.remove('on');}
$('#conectar').onclick=()=>{if(connectMode)return sairConectar();if(MODO==='hier')trocarModo('rede');connectMode=true;connectFrom=null;$('#conectar').classList.add('on');hint(tr('clique2conc'));};
$('#novoNo').onclick=async()=>{
  if(MODO==='hier')return novoProjeto(PROJ||null);
  const nome=await AtlasUI.prompt({title:tr('novoT'),label:tr('nomeConc'),okText:tr('criar'),maxLength:40});
  if(!nome)return;
  if(PROJ&&TK){try{await api('POST','/graph/nodes',{label:nome,project:PROJ});await carregar();return;}catch(e){}}
  await editar({acao:'criar_no',label:nome});};
$('#limpar').onclick=async()=>{
  const r=await AtlasUI.form({title:tr('limparT'),message:tr('limparMsg'),
    fields:[{name:'mem',type:'checkbox',label:tr('limparMem')}],okText:tr('limparBtn'),danger:true});
  if(r){editar({acao:'limpar',tambem_memoria:!!r.mem});fecharPainel();}};
$('#centrar').onclick=centralizar;
$('#zIn').onclick=()=>zoomPor(1.25);
$('#zOut').onclick=()=>zoomPor(.8);

// ── filtros / modos ──
function itemLegenda(cor,txt,o){const s=el('span',o||{},el('i',{style:'background:'+cor,className:(o&&o.dia)?'dia':''}),txt);return s;}
function legenda(){
  const L=$('#legenda');L.innerHTML='';
  if(MODO==='hier'){L.append(itemLegenda('#b07cff',tr('lgGeral')),itemLegenda(CORES.projeto,tr('lgProj')));
    for(const t in CORES_MEM)L.append(itemLegenda(CORES_MEM[t],nomeMem(t)));
    L.append(el('span',{className:'nota'},el('span',{id:'legStats'})));L.style.display='flex';return;}
  const tipos=[...new Set(Object.values(G.nos||{}).map(n=>n.tipo||'tema'))].sort();
  const alternar=t=>()=>{OCULTOS.has(t)?OCULTOS.delete(t):OCULTOS.add(t);reconstruir();};
  for(const t of tipos){const s=itemLegenda(corTipo(t),nomeTipo(t),{className:OCULTOS.has(t)?'off':'',title:tr('lgToggle'),tabIndex:0,onclick:alternar(t)});
    s.setAttribute('role','button');s.setAttribute('aria-pressed',String(!OCULTOS.has(t)));
    s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();alternar(t)();}};L.append(s);}
  if(VER_MEM&&TK){const s=itemLegenda(CORES_MEM.fact,tr('lgMem'),{className:OCULTOS.has('@mem')?'off':'',title:tr('lgToggle'),tabIndex:0,onclick:alternar('@mem'),dia:true});
    s.setAttribute('role','button');L.append(s);}
  if(tipos.length)L.append(el('span',{className:'nota'},el('span',{id:'legStats'}),tr('lgTam')));
  L.style.display=tipos.length?'flex':'none';
}
function trocarModo(m){
  MODO=m;try{localStorage.setItem('atlasGrafoModo',m);}catch(_){}
  for(const b of document.querySelectorAll('#modos button')){b.classList.toggle('on',b.dataset.m===m);b.setAttribute('aria-pressed',String(b.dataset.m===m));}
  $('#ajuda').textContent=tr('aj_'+m);
  $('#subBox').style.display=PROJETOS.length>1&&m!=='hier'?'':'none';
  $('#memBox').style.display=TK&&m!=='hier'?'':'none';
  if(m==='orbita'){cam.auto=true;for(const n of nos)if(Math.abs(n.z)<1)n.z=(Math.random()-.5)*300;}
  if(m==='hier')sairConectar();
  hover=null;fecharPainel();window._assin='';reconstruir();window._centrou=false;setTimeout(centralizar,m==='hier'?50:900);
}
for(const b of document.querySelectorAll('#modos button'))b.onclick=()=>trocarModo(b.dataset.m);
$('#projSel').onchange=()=>{PROJ=$('#projSel').value;window._centrou=false;reconstruir();setTimeout(centralizar,MODO==='hier'?50:1500);};
$('#subChk').onchange=()=>{SUB=$('#subChk').checked;reconstruir();};
$('#memChk').checked=VER_MEM;
$('#memChk').onchange=()=>{VER_MEM=$('#memChk').checked;try{localStorage.setItem('atlasGrafoMem',VER_MEM?'1':'0');}catch(_){}reconstruir();};
$('#busca').addEventListener('input',()=>{BUSCA=norm($('#busca').value.trim());resIdx=0;sujo=true;mostrarRes();});
$('#busca').addEventListener('focus',()=>{if(BUSCA)mostrarRes();});
$('#busca').addEventListener('blur',()=>setTimeout(fecharRes,120));
$('#busca').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!RES.length)return;resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+RES.length)%RES.length;mostrarRes();return;}
  if(e.key==='Escape'){e.stopPropagation();if($('#res').style.display==='block'){fecharRes();return;}$('#busca').value='';BUSCA='';sujo=true;$('#busca').blur();return;}
  if(e.key==='Enter'&&BUSCA){e.preventDefault();const it=RES[resIdx]||resultados()[0];if(it)focarItem(it);}
});
addEventListener('keydown',e=>{
  if(document.querySelector('.ui-back'))return;
  const digitando=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Escape'){sairConectar();fecharPainel();return;}
  if(digitando||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('#busca').focus();}
  else if(e.key==='+'||e.key==='='){zoomPor(1.25);}
  else if(e.key==='-'){zoomPor(.8);}
  else if(e.key==='0'){centralizar();}
});

(async()=>{
  try{const e=await(await fetch('/api/estado')).json();LANGG=e.config.idioma||'pt';
    if(LANGG==='en'||LANGG==='es')fetch('/api/grafo/traduzir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:LANGG})});}catch(_){}
  aplicarI18n();
  try{TK=(await(await fetch('/api/memapi')).json()).token||'';}catch(_){}
  if(!TK&&MODO==='hier')MODO='rede';
  if(!TK)$('#modos button[data-m=hier]').style.display='none';
  trocarModo(MODO);await carregar();laco();
  setInterval(()=>{if(!down&&!connectMode&&!pinch&&document.activeElement.tagName!=='TEXTAREA')carregar();},10000);
})();
</script>
