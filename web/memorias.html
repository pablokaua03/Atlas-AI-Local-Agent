<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memórias</title>
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/ui.css">
<style>
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt)}
  button,input,select,textarea{font-family:inherit;font-size:var(--fs-md)}
  #top{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
  #top h1{display:flex;align-items:center;gap:9px;font-size:var(--fs-lg);font-weight:var(--fw-semi);letter-spacing:-.01em;margin:0}
  #top h1 .ico{color:var(--accent)}
  #top .s{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums}
  #top .links{margin-left:auto;display:flex;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:32px;color:var(--dim);text-decoration:none;font-size:var(--fs-sm);font-weight:var(--fw-medium);
    border:1px solid var(--line);padding:0 12px;border-radius:var(--r-sm);background:none;cursor:pointer;transition:background var(--dur),color var(--dur),border-color var(--dur)}
  .pill:hover{color:var(--txt);background:var(--hover);border-color:var(--line2)}
  #wrap{display:flex;height:calc(100% - 56px)}
  #side{width:260px;flex-shrink:0;border-right:1px solid var(--line);background:var(--bg2);padding:14px 10px;overflow:auto}
  #side h2,#main h2{font-size:var(--fs-xs);font-weight:var(--fw-semi);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:4px 8px 8px}
  .proj{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--dim);transition:background var(--dur),color var(--dur)}
  .proj>.ico{color:var(--faint);flex-shrink:0}
  .proj:hover{background:var(--hover);color:var(--txt)} .proj.on{background:var(--panel2);color:var(--txt)} .proj.on>.ico{color:var(--accent)}
  .proj .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-md)}
  .proj .n{font-size:var(--fs-xs);color:var(--faint);font-variant-numeric:tabular-nums}
  .proj .ac{display:none;align-items:center;justify-content:center;width:26px;height:26px;background:none;border:none;color:var(--dim);cursor:pointer;padding:0;border-radius:var(--r-xs)}
  .proj:hover .ac{display:inline-flex} .proj .ac:hover{color:var(--txt);background:var(--press)} .proj .ac.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .pdesc{font-size:var(--fs-xs);color:var(--dim);margin:8px 8px 12px;white-space:pre-wrap;line-height:1.5}
  #main{flex:1;min-width:0;overflow:auto;padding:18px 24px}
  #conteudo{max-width:900px;margin:0 auto}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .in{height:36px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:0 12px;outline:none;transition:border-color var(--dur),box-shadow var(--dur)}
  textarea.in{height:auto;padding:9px 12px;line-height:1.5}
  select.in{padding-right:30px;appearance:none;background-image:var(--chev);background-repeat:no-repeat;background-position:right 9px center}
  .in:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--line2));box-shadow:var(--ring)}
  #qw{position:relative;flex:1;min-width:200px;display:flex}
  #qw>[data-icon]{position:absolute;left:11px;top:10px;color:var(--faint);pointer-events:none;z-index:1}
  #q{flex:1;padding-left:34px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
    border-radius:10px;padding:0 13px;cursor:pointer;font-weight:var(--fw-medium);white-space:nowrap;transition:background var(--dur),border-color var(--dur),filter var(--dur)}
  .btn:hover{background:var(--panel3)} .btn.pri{background:var(--accent-solid);border-color:transparent;color:var(--accent-fg)} .btn.pri:hover{filter:brightness(1.1)}
  .btn .ico{opacity:.9}
  #novo{display:none;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-md);padding:12px;margin-bottom:14px;box-shadow:var(--shadow-1)}
  #novo textarea{width:100%;min-height:76px;resize:vertical;margin-bottom:8px}
  #novo .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;transition:border-color var(--dur)}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--dim);margin-bottom:6px}
  .meta .src{display:inline-flex;align-items:center;gap:4px}
  .tipo{display:inline-flex;align-items:center;height:20px;border-radius:var(--r-pill);padding:0 8px;color:var(--txt);font-weight:var(--fw-medium);background:color-mix(in srgb,var(--txt) 8%,transparent)}
  .imp{display:inline-flex;gap:3px;cursor:pointer;user-select:none}
  .imp span{width:7px;height:7px;border-radius:50%;background:var(--warn);opacity:.22;font-size:0} .imp span.on{opacity:1}
  .card .ct{font-size:var(--fs-base);line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .herd{display:inline-flex;align-items:center;gap:4px;height:20px;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:var(--r-pill);padding:0 8px}
  .card.herdada{opacity:.85;border-style:dashed}
  .tag{display:inline-flex;align-items:center;height:20px;font-size:11px;background:color-mix(in srgb,var(--txt) 7%,transparent);border:none;border-radius:var(--r-pill);padding:0 8px;color:var(--dim)}
  .ops{margin-left:auto;display:flex;gap:2px}
  .ops button{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:none;border:none;color:var(--dim);cursor:pointer;padding:0;border-radius:var(--r-sm);transition:background var(--dur),color var(--dur)}
  .ops button:hover{color:var(--txt);background:var(--press)} .ops button.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .card textarea{width:100%;min-height:60px;margin-top:4px}
  #vazio,#aviso{color:var(--dim);text-align:center;padding:48px 10px;font-size:var(--fs-md);line-height:1.6}
  @media (max-width:720px){#wrap{flex-direction:column;height:auto}#side{width:auto;border-right:none;border-bottom:1px solid var(--line)}}
  /* ── refinamentos (teclado, toque, celular, skeleton) ── */
  .proj:hover .ac,.proj.on .ac,.proj:focus-within .ac{display:inline-flex}
  .proj:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .imp span:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.danger{background:var(--danger);border-color:transparent;color:#fff}
  #lista .ui-skel.card{margin-bottom:8px}
  .btn.tog[aria-pressed="true"]{border-color:transparent;color:var(--accent);background:var(--accent-soft)}
  .card:hover{border-color:var(--line2)}
  .card.fixada{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
  .fixtag{display:inline-flex;align-items:center;gap:4px;height:20px;font-size:11px;font-weight:var(--fw-medium);color:var(--accent);background:var(--accent-soft);border-radius:var(--r-pill);padding:0 8px}
  .ops button.pin.on{color:var(--accent)}
  .ent{display:inline-flex;align-items:center;gap:4px;height:20px;font-size:11px;background:none;border:1px solid var(--line2);border-radius:var(--r-pill);padding:0 8px;color:var(--accent)}
  .card mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
  .edit{margin-top:6px} .edit .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .edit .row .grow{flex:1;min-width:140px}
  .edit .hint{font-size:var(--fs-xs);color:var(--faint);margin-top:6px}
  #novo label.fx,#herdarBox{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-md);color:var(--dim);cursor:pointer}
  @media (max-width:720px){
    #top{padding:0 12px}#top .links{display:none}#top .s{margin-left:auto}
    #wrap{flex-direction:column;height:auto;min-height:calc(100% - 56px)}
    #side{width:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px}
    #projs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
    #projs .proj{flex:0 0 auto;border:1px solid var(--line);border-radius:var(--r-pill);padding:0 12px;white-space:nowrap}
    #projs .proj.on{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
    #projs .proj .nm{overflow:visible}
    #novoProj{width:auto !important}
    #main{padding:12px}
    .bar .in,.bar .btn,#qw{flex:1 1 100%}
    .bar select.in{flex:1 1 40%}
    .proj .ac,.ops button{width:36px;height:36px}
  }
</style>

<body>
<div id="top"><h1><span data-icon="brain" data-size="18"></span><span id="tt">Memórias</span></h1><span class="s" id="s"></span>
  <div class="links"><a class="pill" href="/grafo" id="lkG">grafo</a><a class="pill" href="/" id="lkV">voltar</a></div></div>

    </div>
  </div>
</div>

};
let LANG='pt', TK='', PROJ='', projetos=[];
const t=(k,v)=>{let s=(I18N[LANG]||I18N.pt)[k]||I18N.pt[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s;};
const tipoLbl=x=>I18N[LANG]['t_'+x]||x;
function el(tag,props,...filhos){const e=document.createElement(tag);Object.assign(e,props||{});for(const f of filhos)if(f!=null)e.append(f);return e;}
const ico=(n,sz)=>window.AtlasIcons?AtlasIcons.el(n,sz||15):null;
const lbl=(no,n,txt,sz)=>{if(window.AtlasIcons)AtlasIcons.label(no,n,txt,sz||15);else no.textContent=txt;return no;};
const ib=(n,props)=>{const b=el('button',Object.assign({type:'button'},props));const i=ico(n,15);if(i)b.append(i);else b.textContent=props.title||'';return b;};
const chip=(cls,n,txt,props)=>el('span',Object.assign({className:cls},props||{}),ico(n,12),el('span',{textContent:txt}));

async function api(m,path,body){
  const r=await fetch('/v1'+path,{method:m,headers:{'Authorization':'Bearer '+TK,'X-Atlas-UI':'1','Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((d.error||{}).message||('HTTP '+r.status));e.code=(d.error||{}).code;throw e;}
  return d;
}
function aviso(msg){$('#aviso').textContent=msg;$('#aviso').style.display=msg?'block':'none';$('#conteudo').style.display=msg?'none':'block';}
// Erros reais viram aviso inline (cofre/token) ou toast; lista vazia NUNCA chega aqui como erro.
async function tentar(fn,silencioso){
  try{return await fn();}
  catch(e){
    if(e.code==='vault_locked')aviso(t('locked'));
    else if(e.code==='unauthorized')aviso(t('noauth'));
    else if(!silencioso)AtlasUI.toast(t('err')+e.message,{kind:'err'});
  }
}

function textos(){
  document.title=t('title');$('#tt').textContent=t('title');lbl($('#lkV'),'arrow-left',t('back'),14);lbl($('#lkG'),'graph',t('graph'),14);
  $('#hP').textContent=t('projects');lbl($('#novoProj'),'plus',t('newProj'));$('#q').placeholder=t('search');$('#q').setAttribute('aria-label',t('search'));
  lbl($('#abrirNovo'),'plus',t('add'));lbl($('#salvarNovo'),'check',t('save'));$('#nImp').setAttribute('aria-label',t('importance'));$('#nConteudo').placeholder=t('content');$('#nTags').placeholder=t('tags');
  $('#fTipo').innerHTML='';$('#fTipo').append(el('option',{value:'',textContent:t('allTypes')}));
  for(const x of TIPOS){$('#fTipo').append(el('option',{value:x,textContent:tipoLbl(x)}));$('#nTipo').append(el('option',{value:x,textContent:tipoLbl(x)}));}
  $('#ordem').append(el('option',{value:'recent',textContent:t('recent')}),el('option',{value:'importance',textContent:t('important')}));
  $('#herdarTxt').textContent=t('inherit');
  lbl($('#fFix'),'pin',t('fPinned'));$('#fFix').title=t('pinHint');
  $('#nFixTxt').textContent=t('pinNew');$('#nFixBox').title=t('pinHint');
}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
// destaca os termos buscados sem usar innerHTML (ignora acentos e maiúsculas)
function marcado(txt,q){
  const frag=document.createDocumentFragment(),toks=[...new Set(norm(q).split(/\s+/).filter(w=>w.length>=2))];
  if(!toks.length){frag.append(txt);return frag;}
  let n='';const mapa=[];
  for(let i=0;i<txt.length;i++){const c=norm(txt[i]);for(const ch of c){n+=ch;mapa.push(i);}}
  const faixas=[];
  for(const w of toks){let p=n.indexOf(w);while(p>=0){faixas.push([mapa[p],mapa[p+w.length-1]+1]);p=n.indexOf(w,p+w.length);}}
  if(!faixas.length){frag.append(txt);return frag;}
  faixas.sort((a,b)=>a[0]-b[0]);const uni=[faixas[0]];
  for(const f of faixas.slice(1)){const u=uni[uni.length-1];if(f[0]<=u[1])u[1]=Math.max(u[1],f[1]);else uni.push(f);}
  let pos=0;for(const [a,b] of uni){if(a>pos)frag.append(txt.slice(pos,a));frag.append(el('mark',{textContent:txt.slice(a,b)}));pos=b;}
  if(pos<txt.length)frag.append(txt.slice(pos));return frag;
}
let FIX=false;

async function carregarProjetos(){
  const d=await tentar(()=>api('GET','/projects'));if(!d){$('#projs').innerHTML='';return;}
  projetos=d.items;const box=$('#projs');box.innerHTML='';
  const total=projetos.reduce((a,p)=>a+p.memories,0);
  const linha=(id,nome,n,p)=>{
    const r=el('div',{className:'proj'+(PROJ===id?' on':'')},ico(p?(p.depth>1?'chevron-right':'folder'):'archive',15),el('span',{className:'nm',textContent:nome}),el('span',{className:'n',textContent:n}));
    if(p&&p.depth>1)r.style.paddingLeft=(10+(p.depth-1)*16)+'px';
    if(p){
      r.append(ib('plus',{className:'ac sub',title:t('subBtn'),ariaLabel:t('subBtn'),onclick:e=>{e.stopPropagation();novoProjeto(p.id==='geral'?null:p);}}));
      r.append(ib('pencil',{className:'ac',title:t('edit'),ariaLabel:t('edit'),onclick:e=>{e.stopPropagation();editarProjeto(p);}}));
      if(p.id!=='geral')r.append(ib('trash',{className:'ac del',title:t('delBtn'),ariaLabel:t('delBtn'),onclick:e=>{e.stopPropagation();excluirProjeto(p);}}));
    }
    r.onclick=()=>{PROJ=id;carregarProjetos();carregarMemorias();};
    r.tabIndex=0;r.setAttribute('role','button');r.onkeydown=e=>{if(e.target===r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.click();}};
    box.append(r);
  };
  linha('',t('all'),total,null);
  for(const p of projetos)linha(p.id,p.name,p.memories,p);
  const sel=projetos.find(p=>p.id===PROJ);
  $('#pdesc').textContent=sel?[sel.path.map(x=>x.name).join(' › '),sel.description].filter(Boolean).join('\n'):'';
  $('#herdarBox').style.display=sel&&sel.id!=='geral'?'flex':'none';
}
async function novoProjeto(pai){
  const r=await AtlasUI.form({title:pai&&pai.id?t('subNew',{p:pai.name}):t('newProjT'),okText:t('save'),cancelText:t('cancel'),
    fields:[{name:'nome',label:t('projNameL'),required:true,maxLength:80},{name:'desc',label:t('projDescL'),type:'textarea',maxLength:2000}]});
  if(!r)return;
  const p=await tentar(()=>api('POST','/projects',{name:r.nome,description:r.desc,parent:pai&&pai.id?pai.id:null}));
  if(p){PROJ=p.id;await carregarProjetos();carregarMemorias();}
}
async function editarProjeto(p){
  const r=await AtlasUI.form({title:t('editProjT'),okText:t('save'),cancelText:t('cancel'),
    fields:[{name:'nome',label:t('projNameL'),value:p.name,required:true,maxLength:80},{name:'desc',label:t('projDescL'),value:p.description||'',type:'textarea',maxLength:2000}]});
  if(!r)return;
  if(await tentar(()=>api('PATCH','/projects/'+encodeURIComponent(p.id),{name:r.nome||p.name,description:r.desc})))carregarProjetos();
}
async function excluirProjeto(p){
  const cascade=!!p.memories;
  if(!await AtlasUI.confirm({title:t('delProjT'),message:cascade?t('projDelMemAll',{p:p.name,n:p.memories}):t('projDel',{p:p.name}),
    okText:t('delBtn'),cancelText:t('cancel'),danger:true}))return;
  if(await tentar(()=>api('DELETE','/projects/'+encodeURIComponent(p.id)+(cascade?'?cascade=true':'')))){
    if(PROJ===p.id)PROJ='';await carregarProjetos();carregarMemorias();
  }
}

async function carregarMemorias(){
  const q=$('#q').value.trim(),tipo=$('#fTipo').value;
  const ps=new URLSearchParams();if(PROJ)ps.set('project',PROJ);if(tipo)ps.set('type',tipo);
  if(PROJ)ps.set('scope',$('#herdar').checked&&PROJ!=='geral'?'inherit':'exact');
  if(q){ps.set('q',q);ps.set('limit','100');}else{ps.set('sort',$('#ordem').value);ps.set('limit','300');if(FIX)ps.set('pinned','true');}
  const d=await tentar(()=>api('GET','/memories?'+ps));
  if(!d){$('#lista').innerHTML='';return;}
  aviso('');
  let itens=d.items;if(FIX)itens=itens.filter(m=>m.pinned);
  if(!q)itens=itens.map((m,i)=>[m,i]).sort((a,b)=>(!!b[0].pinned-!!a[0].pinned)||(a[1]-b[1])).map(x=>x[0]);
  const box=$('#lista');box.innerHTML='';
  const np=itens.filter(m=>m.pinned).length;
  $('#s').textContent=t('count',{n:q||FIX?itens.length:d.total})+(np&&!FIX?t('countPinned',{p:np}):'');
  $('#vazio').style.display=itens.length?'none':'block';$('#vazio').textContent=FIX?t('noPinned'):q?t('noResult'):t('empty');
  for(const m of itens)box.append(cartao(m,q));
}
function cartao(m,q){
  const c=el('div',{className:'card'+(m.pinned?' fixada':'')});
  const imp=el('span',{className:'imp',title:t('importance')});
  for(let i=1;i<=5;i++){const dot=el('span',{className:i<=m.importance?'on':'',textContent:'●',tabIndex:0,
    onclick:async()=>{if(await tentar(()=>api('PATCH','/memories/'+m.id,{importance:i})))carregarMemorias();}});
    dot.setAttribute('role','button');dot.setAttribute('aria-label',t('importance')+' '+i);
    dot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dot.click();}};imp.append(dot);}
  const nomeProj=(projetos.find(p=>p.id===m.project)||{}).name||m.project;
  if(m.inherited)c.classList.add('herdada');
  const meta=el('div',{className:'meta'},el('span',{className:'tipo',textContent:tipoLbl(m.type)}),imp,
    m.pinned?chip('fixtag','pin',t('pinnedTag'),{title:t('pinHint')}):null,
    m.inherited?chip('herd','arrow-up',t('inheritedFrom',{p:nomeProj})):(PROJ?null:chip('src','folder',nomeProj)),
    el('span',{textContent:t('by')+' '+m.source}),el('span',{textContent:(m.updated||'').replace('T',' ').slice(0,16)}));
  const ct=el('div',{className:'ct'});ct.append(q?marcado(m.content,q):m.content);
  const pin=ib('pin',{className:'pin'+(m.pinned?' on':''),title:(m.pinned?t('unpin'):t('pin'))+' · '+t('pinHint'),
    ariaLabel:m.pinned?t('unpin'):t('pin'),onclick:async()=>{
      if(await tentar(()=>api('PATCH','/memories/'+m.id,{pinned:!m.pinned}))){AtlasUI.toast(m.pinned?t('unpinnedOk'):t('pinnedOk'),{kind:'ok'});carregarMemorias();}}});
  pin.setAttribute('aria-pressed',String(!!m.pinned));
  const ops=el('div',{className:'ops'},pin,
    ib('pencil',{title:t('edit'),ariaLabel:t('edit'),onclick:()=>editar(c,m,ct)}),
    ib('trash',{className:'del',title:t('remove'),ariaLabel:t('remove'),onclick:async()=>{
      if(await AtlasUI.confirm({title:t('delMemT'),message:t('del')+'\n\n“'+(m.content.length>140?m.content.slice(0,140)+'…':m.content)+'”',
        okText:t('forgetBtn'),cancelText:t('cancel'),danger:true})&&await tentar(()=>api('DELETE','/memories/'+m.id))){carregarMemorias();carregarProjetos();}}}));
  meta.append(ops);c.append(meta,ct);
  const chips=[...(m.tags||[]).map(x=>el('span',{className:'tag',textContent:'#'+x})),
    ...(m.entities||[]).slice(0,8).map(x=>chip('ent','graph',x))];
  if(chips.length)c.append(el('div',{className:'tags'},...chips));
  return c;
}
function editar(c,m,ct){
  if(c.querySelector('.edit'))return;
  const ta=el('textarea',{className:'in',value:m.content,rows:3,ariaLabel:t('content')});
  const tipo=el('select',{className:'in',ariaLabel:t('typeL'),title:t('typeL')});
  for(const x of [...new Set([...TIPOS,m.type])])tipo.append(el('option',{value:x,textContent:tipoLbl(x),selected:x===m.type}));
  const proj=el('select',{className:'in grow',ariaLabel:t('projL'),title:t('projL')});
  for(const p of projetos)proj.append(el('option',{value:p.id,textContent:'\u00A0\u00A0'.repeat(Math.max(0,(p.depth||1)-1))+p.name,selected:p.id===m.project}));
  const imp=el('select',{className:'in',ariaLabel:t('impL'),title:t('impL')});
  for(let i=1;i<=5;i++)imp.append(el('option',{value:i,textContent:'●'.repeat(i),selected:i===m.importance}));
  const tg=el('input',{className:'in grow',value:(m.tags||[]).join(', '),placeholder:t('tags'),ariaLabel:t('tags')});
  const fechar=()=>{ed.remove();ct.style.display='';};
  const salvar=async()=>{
    const body={content:ta.value.trim(),tags:tg.value,type:tipo.value,importance:+imp.value};
    if(!body.content){ta.focus();return;}
    const mudouProj=proj.value&&proj.value!==m.project;if(mudouProj)body.project=proj.value;
    if(await tentar(()=>api('PATCH','/memories/'+m.id,body))){carregarMemorias();if(mudouProj)carregarProjetos();}};
  const ok=lbl(el('button',{className:'btn pri',onclick:salvar}),'check',t('save'));
  const no=el('button',{className:'btn',textContent:t('cancel'),onclick:fechar});
  const ed=el('div',{className:'edit'},ta,el('div',{className:'row'},tipo,proj,imp),el('div',{className:'row'},tg,no,ok),
    el('div',{className:'hint',textContent:t('editHint')}));
  ed.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();salvar();}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();fechar();}});
  ta.style.width='100%';ct.style.display='none';ct.after(ed);ta.focus();
}
async function salvarNova(){
  const conteudo=$('#nConteudo').value.trim();if(!conteudo)return;
  const m=await tentar(()=>api('POST','/memories',{content:conteudo,project:PROJ||'geral',type:$('#nTipo').value,
    tags:$('#nTags').value,importance:+$('#nImp').value,source:'atlas-ui',pinned:$('#nFix').checked}));
  if(m){$('#nConteudo').value='';$('#nTags').value='';$('#nFix').checked=false;$('#novo').style.display='none';carregarMemorias();carregarProjetos();}
}

let qT;
$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(carregarMemorias,300);});
$('#fTipo').onchange=carregarMemorias;$('#ordem').onchange=carregarMemorias;$('#herdar').onchange=carregarMemorias;
$('#fFix').onclick=()=>{FIX=!FIX;$('#fFix').setAttribute('aria-pressed',String(FIX));carregarMemorias();};
$('#novoProj').onclick=novoProjeto;$('#salvarNovo').onclick=salvarNova;
$('#abrirNovo').onclick=()=>{const n=$('#novo');n.style.display=n.style.display==='block'?'none':'block';if(n.style.display==='block')$('#nConteudo').focus();};
$('#nConteudo').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))salvarNova();});

(async()=>{
  try{const e=await(await fetch('/api/estado')).json();LANG=e.config.idioma||'pt';
    document.documentElement.dataset.tema=e.config.tema||'escuro';document.documentElement.lang=LANG;}catch(_){}
  textos();AtlasUI.labels({ok:t('confirmT'),cancel:t('cancel')});AtlasUI.nav('mem',{idioma:LANG});
  try{TK=(await(await fetch('/api/memapi')).json()).token||'';}catch(_){}
  if(location.hash.length>1)PROJ=decodeURIComponent(location.hash.slice(1));     // /memorias#projeto (vem do grafo)
  await carregarProjetos();
  if(PROJ&&!projetos.some(p=>p.id===PROJ)){PROJ='';await carregarProjetos();}
  await carregarMemorias();
})();
</script>
