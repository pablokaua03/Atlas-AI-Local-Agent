<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memórias</title>
<link rel="icon" href="/static/favicon.png">
<style>
  :root{
    --bg:#0d0f13; --bg2:#0b0d11; --panel:#161a21; --panel2:#1b2029; --line:#222834;
    --txt:#e6e9ef; --dim:#8b94a3; --accent:#7c9bff; --good:#5ad1c2; --warn:#ffd166; --danger:#ff6b6b;
  }
  :root[data-tema="claro"]{
    --bg:#f6f7fb; --bg2:#eef0f6; --panel:#ffffff; --panel2:#f0f2f8; --line:#e2e6ef;
    --txt:#1b2130; --dim:#67708a; --accent:#4f6bf6; --good:#1aa896; --warn:#b8860b; --danger:#e5484d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif}
  button,input,select,textarea{font-family:inherit;font-size:13px}
  #top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
  #top h1{font-size:15px;margin:0} #top .s{font-size:13px;color:var(--dim)}
  #top .links{margin-left:auto;display:flex;gap:8px}
  .pill{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:20px;background:none;cursor:pointer}
  .pill:hover{color:var(--txt);border-color:var(--accent)}
  #wrap{display:flex;height:calc(100% - 52px)}
  #side{width:250px;flex-shrink:0;border-right:1px solid var(--line);background:var(--bg2);padding:12px;overflow:auto}
  #side h2,#main h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px 8px}
  .proj{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--dim)}
  .proj:hover{background:var(--panel);color:var(--txt)} .proj.on{background:var(--panel2);color:var(--txt)}
  .proj .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .proj .n{font-size:11px;color:var(--dim)}
  .proj .ac{display:none;background:none;border:none;color:var(--dim);cursor:pointer;padding:0 2px}
  .proj:hover .ac{display:inline} .proj .ac:hover{color:var(--txt)} .proj .ac.del:hover{color:var(--danger)}
  .pdesc{font-size:12px;color:var(--dim);margin:2px 4px 12px;white-space:pre-wrap}
  #main{flex:1;min-width:0;overflow:auto;padding:16px 20px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .in{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;outline:none}
  .in:focus{border-color:var(--accent)}
  #q{flex:1;min-width:200px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  #novo{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  #novo textarea{width:100%;min-height:70px;resize:vertical;margin-bottom:8px}
  #novo .row{display:flex;gap:8px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .tipo{border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--txt)}
  .imp{letter-spacing:1px;cursor:pointer;color:var(--warn);user-select:none}
  .imp span{opacity:.25} .imp span.on{opacity:1}
  .card .ct{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--dim)}
  .ops{margin-left:auto;display:flex;gap:4px}
  .ops button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px}
  .ops button:hover{color:var(--txt);background:var(--panel2)} .ops button.del:hover{color:var(--danger)}
  .card textarea{width:100%;min-height:60px;margin-top:4px}
  #vazio,#aviso{color:var(--dim);text-align:center;padding:40px 10px;font-size:14px}
  @media (max-width:720px){#wrap{flex-direction:column;height:auto}#side{width:auto;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="top"><h1 id="tt">🗂️ Memórias</h1><span class="s" id="s"></span>
  <div class="links"><a class="pill" href="/grafo" id="lkG">🕸️ grafo</a><a class="pill" href="/" id="lkV">← voltar</a></div></div>
<div id="wrap">
  <div id="side">
    <h2 id="hP">Projetos</h2>
    <div id="projs"></div>
    <div class="pdesc" id="pdesc"></div>
    <button class="btn" id="novoProj" style="width:100%"></button>
  </div>
  <div id="main">
    <div id="aviso" style="display:none"></div>
    <div id="conteudo">
      <div class="bar">
        <input class="in" id="q" autocomplete="off">
        <select class="in" id="fTipo"></select>
        <select class="in" id="ordem"></select>
        <button class="btn pri" id="abrirNovo"></button>
      </div>
      <div id="novo">
        <textarea class="in" id="nConteudo"></textarea>
        <div class="row">
          <select class="in" id="nTipo"></select>
          <input class="in" id="nTags" style="flex:1;min-width:150px">
          <select class="in" id="nImp"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
          <button class="btn pri" id="salvarNovo"></button>
        </div>
      </div>
      <div id="lista"></div>
      <div id="vazio" style="display:none"></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const TIPOS=['note','fact','preference','decision','task','event'];
const I18N={
 pt:{title:"Memórias",back:"← voltar",graph:"🕸️ grafo",projects:"Projetos",all:"Todos",newProj:"➕ Novo projeto",
   projName:"Nome do projeto:",projDesc:"Descrição (opcional):",projDel:"Excluir o projeto \"{p}\"?",projDelMem:"Ele tem {n} memória(s). Excluir também?",
   search:"Buscar nas memórias…",allTypes:"Todos os tipos",recent:"Mais recentes",important:"Mais importantes",
   add:"➕ Nova memória",save:"Salvar",cancel:"Cancelar",content:"O que lembrar? (uma afirmação clara)",tags:"tags, separadas por vírgula",
   empty:"Nenhuma memória aqui ainda. As IAs conectadas (API/MCP) e você podem adicionar.",noResult:"Nada encontrado.",
   count:"{n} memória(s)",del:"Esquecer esta memória?",edit:"editar",remove:"esquecer",by:"por",
   locked:"O cofre está bloqueado. Volte à tela principal e desbloqueie.",err:"Erro: ",
   t_note:"nota",t_fact:"fato",t_preference:"preferência",t_decision:"decisão",t_task:"tarefa",t_event:"evento"},
 en:{title:"Memories",back:"← back",graph:"🕸️ graph",projects:"Projects",all:"All",newProj:"➕ New project",
   projName:"Project name:",projDesc:"Description (optional):",projDel:"Delete project \"{p}\"?",projDelMem:"It has {n} memory(ies). Delete them too?",
   search:"Search memories…",allTypes:"All types",recent:"Most recent",important:"Most important",
   add:"➕ New memory",save:"Save",cancel:"Cancel",content:"What to remember? (one clear statement)",tags:"tags, comma separated",
   empty:"No memories here yet. Connected AIs (API/MCP) and you can add them.",noResult:"Nothing found.",
   count:"{n} memory(ies)",del:"Forget this memory?",edit:"edit",remove:"forget",by:"by",
   locked:"The vault is locked. Go back to the main screen and unlock it.",err:"Error: ",
   t_note:"note",t_fact:"fact",t_preference:"preference",t_decision:"decision",t_task:"task",t_event:"event"},
 es:{title:"Memorias",back:"← volver",graph:"🕸️ grafo",projects:"Proyectos",all:"Todos",newProj:"➕ Nuevo proyecto",
   projName:"Nombre del proyecto:",projDesc:"Descripción (opcional):",projDel:"¿Eliminar el proyecto \"{p}\"?",projDelMem:"Tiene {n} memoria(s). ¿Eliminarlas también?",
   search:"Buscar en las memorias…",allTypes:"Todos los tipos",recent:"Más recientes",important:"Más importantes",
   add:"➕ Nueva memoria",save:"Guardar",cancel:"Cancelar",content:"¿Qué recordar? (una afirmación clara)",tags:"etiquetas, separadas por coma",
   empty:"Aún no hay memorias aquí. Las IAs conectadas (API/MCP) y tú pueden añadirlas.",noResult:"Nada encontrado.",
   count:"{n} memoria(s)",del:"¿Olvidar esta memoria?",edit:"editar",remove:"olvidar",by:"por",
   locked:"La caja fuerte está bloqueada. Vuelve a la pantalla principal y desbloquéala.",err:"Error: ",
   t_note:"nota",t_fact:"hecho",t_preference:"preferencia",t_decision:"decisión",t_task:"tarea",t_event:"evento"},
};
let LANG='pt', TK='', PROJ='', projetos=[];
const t=(k,v)=>{let s=(I18N[LANG]||I18N.pt)[k]||I18N.pt[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s;};
const tipoLbl=x=>I18N[LANG]['t_'+x]||x;
function el(tag,props,...filhos){const e=document.createElement(tag);Object.assign(e,props||{});for(const f of filhos)if(f!=null)e.append(f);return e;}

async function api(m,path,body){
  const r=await fetch('/v1'+path,{method:m,headers:{'Authorization':'Bearer '+TK,'X-Atlas-UI':'1','Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((d.error||{}).message||('HTTP '+r.status));e.code=(d.error||{}).code;throw e;}
  return d;
}
function aviso(msg){$('#aviso').textContent=msg;$('#aviso').style.display=msg?'block':'none';$('#conteudo').style.display=msg?'none':'block';}
async function tentar(fn){try{return await fn();}catch(e){if(e.code==='vault_locked')aviso(t('locked'));else alert(t('err')+e.message);}}

function textos(){
  document.title=t('title');$('#tt').textContent='🗂️ '+t('title');$('#lkV').textContent=t('back');$('#lkG').textContent=t('graph');
  $('#hP').textContent=t('projects');$('#novoProj').textContent=t('newProj');$('#q').placeholder=t('search');
  $('#abrirNovo').textContent=t('add');$('#salvarNovo').textContent=t('save');$('#nConteudo').placeholder=t('content');$('#nTags').placeholder=t('tags');
  $('#fTipo').innerHTML='';$('#fTipo').append(el('option',{value:'',textContent:t('allTypes')}));
  for(const x of TIPOS){$('#fTipo').append(el('option',{value:x,textContent:tipoLbl(x)}));$('#nTipo').append(el('option',{value:x,textContent:tipoLbl(x)}));}
  $('#ordem').append(el('option',{value:'recent',textContent:t('recent')}),el('option',{value:'importance',textContent:t('important')}));
}

async function carregarProjetos(){
  const d=await tentar(()=>api('GET','/projects'));if(!d)return;
  projetos=d.items;const box=$('#projs');box.innerHTML='';
  const total=projetos.reduce((a,p)=>a+p.memories,0);
  const linha=(id,nome,n,p)=>{
    const r=el('div',{className:'proj'+(PROJ===id?' on':'')},el('span',{className:'nm',textContent:nome}),el('span',{className:'n',textContent:n}));
    if(p){
      r.append(el('button',{className:'ac',textContent:'✎',title:t('edit'),onclick:e=>{e.stopPropagation();editarProjeto(p);}}));
      if(p.id!=='geral')r.append(el('button',{className:'ac del',textContent:'✕',title:'✕',onclick:e=>{e.stopPropagation();excluirProjeto(p);}}));
    }
    r.onclick=()=>{PROJ=id;carregarProjetos();carregarMemorias();};box.append(r);
  };
  linha('',t('all'),total,null);
  for(const p of projetos)linha(p.id,p.name,p.memories,p);
  const sel=projetos.find(p=>p.id===PROJ);$('#pdesc').textContent=sel?sel.description:'';
}
async function novoProjeto(){
  const nome=prompt(t('projName'));if(!nome||!nome.trim())return;
  const desc=prompt(t('projDesc'))||'';
  const p=await tentar(()=>api('POST','/projects',{name:nome.trim(),description:desc}));
  if(p){PROJ=p.id;await carregarProjetos();carregarMemorias();}
}
async function editarProjeto(p){
  const nome=prompt(t('projName'),p.name);if(nome===null)return;
  const desc=prompt(t('projDesc'),p.description);if(desc===null)return;
  if(await tentar(()=>api('PATCH','/projects/'+encodeURIComponent(p.id),{name:nome.trim()||p.name,description:desc})))carregarProjetos();
}
async function excluirProjeto(p){
  if(!confirm(t('projDel',{p:p.name})))return;
  let cascade=false;
  if(p.memories){if(!confirm(t('projDelMem',{n:p.memories})))return;cascade=true;}
  if(await tentar(()=>api('DELETE','/projects/'+encodeURIComponent(p.id)+(cascade?'?cascade=true':'')))){
    if(PROJ===p.id)PROJ='';await carregarProjetos();carregarMemorias();
  }
}

async function carregarMemorias(){
  const q=$('#q').value.trim(),tipo=$('#fTipo').value;
  const ps=new URLSearchParams();if(PROJ)ps.set('project',PROJ);if(tipo)ps.set('type',tipo);
  if(q){ps.set('q',q);ps.set('limit','100');}else{ps.set('sort',$('#ordem').value);ps.set('limit','300');}
  const d=await tentar(()=>api('GET','/memories?'+ps));if(!d)return;
  aviso('');
  const itens=d.items,box=$('#lista');box.innerHTML='';
  $('#s').textContent=t('count',{n:q?itens.length:d.total});
  $('#vazio').style.display=itens.length?'none':'block';$('#vazio').textContent=q?t('noResult'):t('empty');
  for(const m of itens)box.append(cartao(m));
}
function cartao(m){
  const c=el('div',{className:'card'});
  const imp=el('span',{className:'imp',title:'importância'});
  for(let i=1;i<=5;i++)imp.append(el('span',{className:i<=m.importance?'on':'',textContent:'●',
    onclick:async()=>{if(await tentar(()=>api('PATCH','/memories/'+m.id,{importance:i})))carregarMemorias();}}));
  const nomeProj=(projetos.find(p=>p.id===m.project)||{}).name||m.project;
  const meta=el('div',{className:'meta'},el('span',{className:'tipo',textContent:tipoLbl(m.type)}),imp,
    PROJ?null:el('span',{textContent:'📁 '+nomeProj}),
    el('span',{textContent:t('by')+' '+m.source}),el('span',{textContent:(m.updated||'').replace('T',' ').slice(0,16)}));
  const ct=el('div',{className:'ct',textContent:m.content});
  const ops=el('div',{className:'ops'},
    el('button',{textContent:'✎',title:t('edit'),onclick:()=>editar(c,m,ct)}),
    el('button',{className:'del',textContent:'🗑',title:t('remove'),onclick:async()=>{
      if(confirm(t('del'))&&await tentar(()=>api('DELETE','/memories/'+m.id))){carregarMemorias();carregarProjetos();}}}));
  meta.append(ops);c.append(meta,ct);
  if(m.tags&&m.tags.length)c.append(el('div',{className:'tags'},...m.tags.map(x=>el('span',{className:'tag',textContent:'#'+x}))));
  return c;
}
function editar(c,m,ct){
  if(c.querySelector('textarea'))return;
  const ta=el('textarea',{className:'in',value:m.content});
  const tg=el('input',{className:'in',value:(m.tags||[]).join(', '),placeholder:t('tags'),style:'flex:1'});
  const ok=el('button',{className:'btn pri',textContent:t('save'),onclick:async()=>{
    if(await tentar(()=>api('PATCH','/memories/'+m.id,{content:ta.value,tags:tg.value})))carregarMemorias();}});
  const no=el('button',{className:'btn',textContent:t('cancel'),onclick:()=>{ed.remove();ct.style.display='';}});
  const ed=el('div',{},ta,el('div',{style:'display:flex;gap:6px;margin-top:6px'},tg,no,ok));
  ct.style.display='none';ct.after(ed);ta.focus();
}
async function salvarNova(){
  const conteudo=$('#nConteudo').value.trim();if(!conteudo)return;
  const m=await tentar(()=>api('POST','/memories',{content:conteudo,project:PROJ||'geral',type:$('#nTipo').value,
    tags:$('#nTags').value,importance:+$('#nImp').value,source:'atlas-ui'}));
  if(m){$('#nConteudo').value='';$('#nTags').value='';$('#novo').style.display='none';carregarMemorias();carregarProjetos();}
}

let qT;
$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(carregarMemorias,300);});
$('#fTipo').onchange=carregarMemorias;$('#ordem').onchange=carregarMemorias;
$('#novoProj').onclick=novoProjeto;$('#salvarNovo').onclick=salvarNova;
$('#abrirNovo').onclick=()=>{const n=$('#novo');n.style.display=n.style.display==='block'?'none':'block';if(n.style.display==='block')$('#nConteudo').focus();};
$('#nConteudo').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))salvarNova();});

(async()=>{
  try{const e=await(await fetch('/api/estado')).json();LANG=e.config.idioma||'pt';
    document.documentElement.dataset.tema=e.config.tema||'escuro';document.documentElement.lang=LANG;}catch(_){}
  textos();
  try{TK=(await(await fetch('/api/memapi')).json()).token||'';}catch(_){}
  await carregarProjetos();await carregarMemorias();
})();
</script>
</body>
</html>
